id: owc-engine-error-message-wording
subject: 'Object.setPrototypeOf on a non-extensible object reports QuickJS 0.32''s own words -- "object is not extensible" for every receiver -- where host Node 24.15 names the receiver: "#<Object> is not extensible", "[object Array] is not extensible", "function f() {} is not extensible"'
description: 'Measured 2026-10-23 by the repair lane for shard esm (session adv7-fix-esm-11) at HEAD ceaf933, container against host Node 24.15, one boot per case. It is the residual the judge split off from owc-esm-namespace-mutation-error-text, and it is not that row: the receiver here is a plain object, an array and a function, not a module namespace, and the namespace row matches Node on all four of its own lines. Container, one line each: Object.setPrototypeOf(Object.preventExtensions({}), {}) throws TypeError "object is not extensible"; Object.preventExtensions([]) throws TypeError "object is not extensible"; Object.preventExtensions(function f() {}) throws TypeError "object is not extensible"; Object.seal({}) and Object.freeze({}) throw TypeError "object is not extensible". Host: "#<Object> is not extensible", "[object Array] is not extensible", "function f() {} is not extensible", "#<Object> is not extensible", "#<Object> is not extensible". Proved to be the engine''s and not this container''s with bare QuickJS 0.32 and nothing in the way (quickjs-emscripten, evalCode of the same five calls in a fresh runtime and context): every one of the five answers TypeError "object is not extensible" there too, so V8 names the receiver in its message and QuickJS names the type word alone, and no edit around the container can change it. Recorded rather than fixed: the sentence is the engine''s.'
owner: lanmower
session_id: adv7-fix-esm-11
witness_plan: 'Differential of Object.setPrototypeOf over Object.preventExtensions({}), Object.preventExtensions([]), Object.preventExtensions(function f() {}), Object.seal({}) and Object.freeze({}), printing the constructor and message of the throw, host Node 24.15 vs container; control: the same five calls under bare QuickJS 0.32 with no container in the way.'
status: pending
