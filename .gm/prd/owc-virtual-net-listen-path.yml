host answers address() with the path in every one. Reaching them needs the container filesystem plumbed into the hub (packages/core/src/network/virtual/hub.ts takes only a sink), so it is wider than this shard''''s two files. The one residual the earlier witness named -- server.listen(''''''''x.sock'''''''') and server.listen(''''''''localhost'''''''') being ERR_SOCKET_BAD_PORT where host binds a socket file -- is confirmed and still needs a field on the ''''''''net.listen'''''''' payload (packages/core/src/process/executors/node/runtime/capabilities/net.ts:91), a file this shard does not own. No regression: j-reg''''s unix section (bind, connect, exchange, rebind EADDRINUSE, 105-byte EINVAL, unbound ENOENT, address after close) and its 17 TCP rows match host line for line. npx tsc --noEmit clean in packages/core; pnpm build succeeds.'
