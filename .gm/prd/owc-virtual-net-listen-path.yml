and still needs a field on the ''''''''net.listen'''''''' payload
(packages/core/src/process/executors/node/runtime/capabilities/net.ts:91), a file this shard does not own.
No regression: j-reg''''s unix section (bind, connect, exchange, rebind EADDRINUSE, 105-byte EINVAL,
