35, 17, 6, 6 and 2 keys there; key counts node:fs 102/105, node:util 22/35, node:assert 17/23,
node:path 16/18, node:events 13/16, node:os 22/24, node:vm 10/11, node:repl 7/8,
node:worker_threads 18/22, node:module 29/31. Every fix site is outside this shard --
runtime/guest/buffer-fs.ts, runtime/guest/misc.ts, runtime/guest/path-events.ts and whatever
registers the builtin name beside BF -- so the row is named and not edited.
