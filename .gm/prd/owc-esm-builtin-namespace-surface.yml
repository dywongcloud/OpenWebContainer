id: owc-esm-builtin-namespace-surface
subject: 'ESM: the namespace of a builtin module is thinner than Node''s, so Object.keys(await import("node:path")).length is 16 where host Node 24.15 gives 18 and node:fs lacks cp, glob, statfs, lutimes and openAsBlob'
description: 'Re-measured 2026-10-23 by the judge for shard esm-surface (session adv6-judge-esm-surface-3), container against host Node 24.15, one container boot per case, in isolation. Two items are done and one claim is stale. node:stream/web now exports CompressionStream and DecompressionStream AND they work: a write to a CompressionStream''s writable used never to settle -- the class was built over a TransformStream, whose write does not settle until its readable is read, and a stream whose whole output exists only once the writable has closed can never be read in time -- and it now settles, gzip of ''hello world hello world'' is the host''s own 34 bytes 1f8b0800000000000013cb48, deflate is the host''s own 22, an invalid format answers Node''s own ''Failed to construct ''''CompressionStream'''': 1st argument value ''''bogus'''' is not a valid enum value of type CompressionFormat.'', and the round trip decompresses to the input (case b2, byte-identical to host). The ''node:fs lacks cp, glob, statfs, lutimes and openAsBlob'' claim is stale: cp, cpSync, statfs, statfsSync and openAsBlob are all present now (105 host keys against 90 container keys). Still missing from node:fs: glob/globSync, lutimes/lutimesSync, FileReadStream, FileWriteStream, ReadStream, Utf8Stream, WriteStream, _toUnixTimestamp, fchown(Sync), futimes(Sync), lchmod(Sync), lchown(Sync), mkdtempDisposableSync; and F_OK/R_OK/W_OK/X_OK still sit at the top level where the host keeps them under fs.constants only. Everything else stands, and almost none of it is in the files this shard owns -- the row''s own fix site is wrong. node:path is BF.path in runtime/guest/path-events.ts (add matchesGlob and _makeLong); node:fs is BF.fs in runtime/guest/buffer-fs.ts (the names above), and node:constants and BF[''fs/promises''] are in the same file (56 against 232; and glob, watch and mkdtempDisposable); node:os is BF.os in runtime/guest/misc.ts (add getPriority and setPriority; its constants are ''errno, signals'' against the host''s ''UV_UDP_REUSEADDR, dlopen, errno, priority, signals'', with 33 signals against 31), and BF.crypto (46 against 70) and BF.module (no stripTypeScriptTypes, register, enableCompileCache, findPackageJSON, SourceMap or runMain; still carries wrap, wrapper and createRequireFromPath) are in the same file. node:stream/consumers does not resolve at all -- ERR_MODULE_NOT_FOUND "Cannot find package ''node:stream'' imported from /app/main.mjs" -- where Node has arrayBuffer, blob, buffer, bytes, default, json and text; it belongs beside BF.stream in runtime/guest/modules/stream.ts plus whatever registers the builtin name, and is still unreached. Also divergent and unlisted before: node:sys is ERR_MODULE_NOT_FOUND where the host resolves it with 35 keys, and node:inspector 8 against 9, node:assert 17 against 23, node:timers 7 against 8, node:worker_threads 16 against 22, node:child_process 9 against 10, node:vm 10 against 11, node:repl 7 against 8. node:sqlite, node:test, node:sea and node:wasi are ERR_MODULE_NOT_FOUND where the host has 6, 17, 6 and 2. Unclaimed but matching: node:stream 24/24, node:stream/promises 3/3, node:url 15/15, node:zlib 48/48, node:readline 9/9, node:util 22 against 35 (divergent), node:events 13 against 16, node:buffer 9 against 15.'
