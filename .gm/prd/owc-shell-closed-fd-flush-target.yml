id: owc-shell-closed-fd-flush-target
subject: where the text a closed descriptor could not hold lands once a host flushes it
description: 'Measured 2026-10-23, differential against this machine''s /bin/sh (bash 3.2.57), live container at local HEAD 91e46e7 + this line''s own fd fixes. A host holds the write in its buffer and flushes it later, so it lands wherever the standard output is by then, and the container flushes it to the output the shell started with. `exec >d; echo hi >&-; exec >&2; echo O=[$(cat d)]` is host stdout "" stderr "sh: line 0: echo: write error: Bad file descriptor\nhi\nO=[hi]" (the text reaches the file `exec` named and then the error stream), container stdout "hi" stderr the one error and "O=[]". Two writes behind a later `exec` -- `exec >d; echo hi >&-; exec >/dev/null; echo hi2 >&-; exec >&2; echo O=[$(cat d)]` -- is host "O=[hi hi2]" against the container''s "O=[]". The other way round, a construct''s own redirection is put back before the flush: `{ echo hi >&-; } > f; echo rc=$?; echo O=[$(cat f)]` is host stdout "hi\nrc=1\nO=[]" -- the text on the original output and `f` empty -- against the container''s "rc=1\nO=[hi]". `exec 1>&-; echo hi 1>&1; echo rc=$?` is host stdout "" against the container''s "hi\nrc=1". Fix site: `finish` in packages/core/src/shell/commands/builtins.ts, which writes the buffered text with `writeOut` instead of through `state.stdoutTarget` at the moment a host flushes.'
owner: lanmower
session_id: adv3-judge-shell-fd-3
witness_plan: Run `exec >d; echo hi >&-; exec >&2; echo O=[$(cat d)]`, `{ echo hi >&-; } > f; echo O=[$(cat f)]` and `exec 1>&-; echo hi 1>&1; echo rc=$?` on both sides; each must match the host text above.
status: pending
