id: owc-domain-bound-async-throw-leaves-domain-entered
title: "RESOLVED: a throw out of a d.bind(...) callback driven by a timer or a nextTick left the domain entered for the rest of the process"
classification: GUEST
session_id: adv7-judge-domain-10
owner: adv7-judge-domain-10
status: completed
resolved_by: adv7-judge-domain-10
resolved_at: HEAD + the uncaughtInDomain fix in pure-b.ts (adv7-judge-domain-10)
subject: 'uncaughtInDomain in packages/core/src/process/executors/node/runtime/guest/modules/pure-b.ts spliced one entry off domain._stack. A callback a domain owns -- a timer scheduled inside d.run(), or a nextTick -- enters the domain on its way in, and d.bind''s own runInDomain enters it again, so the domain is on the stack twice; one splice left the second behind and the process ran the rest of its life inside the domain. Host node 24.15 pops every adjacent duplicate (lib/domain.js: while (exports.active === this) this.exit()) and then empties the stack, so a later timer runs outside the domain. Measured: b06, t04, t05, t07, t09 -- host later-stack=0 / later-pd=null, container later-stack=1 / later-pd=the domain, and t09''s second and third timers answered second-pd-is-d=true/stack 1 and third-pd-is-d=true/stack 1 against host false/0 and false/0. An unbound callback (t02, t03, t06, ex-q7) puts the domain on the stack once, which is why the corpus missed it.'
acceptance_criteria:
- 'b06 prints later-stack=0 and later-pd=null, as host node 24.15 does'
- 't09 prints second-pd-is-d=false / second-stack=0 and third-pd-is-d=false / third-stack=0, as host node 24.15 does'
- 't04 prints stack-in-handler=0 / pd-in-handler=null / capture-in-handler=false, as host node 24.15 does'
witness_plan: Run /tmp/owc-r4/judge-domain-10/cases/b06-bind-timer-throw, cases2/t04-bound-timer-no-domain-listener, cases2/t05-bound-timer-handler-state, cases2/t07-bound-tick-throw and cases5/t09-bound-timer-then-second-timer under host node 24.15 and in the container via /tmp/owc-r4/probe2/run-owc-repo.mts from packages/core and diff stdout, stderr and exit code.
body: |-
  VERIFIED AND FIXED (adv7-judge-domain-10). Each case re-run in isolation on both sides, the five
  run twice on the container and byte-identical both times. Load 15-45, free 52 MB - 2.8 GB.

  After: b06 after-schedule=yes / DOMAIN.ERROR=timer-bound / later-stack=0 / later-pd=null; t04
  UNCAUGHT=timer-nol / stack-in-handler=0 / pd-in-handler=null / capture-in-handler=false /
  late-stack=0 / late-pd=null; t05 stack-in-handler=0 / pd-in-handler=undefined / domainThrown=true /
  err-domain-is-d=true / late-stack=0 / late-pd=null / late-active=null; t07 and t09 the same shape as
  b06 and t05 -- every line identical to host node 24.15.

  No regression: b01-b12, b14 (timer-pd-is-d=true / timer-stack=2 / DOMAIN.ERROR=timer-after-caught /
  late=yes, which is host's answer too), t01, t02, t03, t06, t08, u01, u03, x01-x06, c1, c16, c18,
  d-r8, p2, p4, r01, r02, r04, r05, r06, r08, r09 all still match.
