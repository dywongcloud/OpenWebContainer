id: owc-esm-wasm-and-typescript-format
session_id: adv5-fix-esm-surface-0
status: pending
owner: lanmower
subject: 'ESM: a .ts reached by a dynamic import or as a dependency hands an Error with no code where host Node 24.15 hands a SyntaxError carrying ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX or ERR_INVALID_TYPESCRIPT_SYNTAX'
description: 'Re-measured 2026-10-23 (repair lane adv5-fix-esm-surface-0, differential container vs host Node 24.15.0, each case run twice with identical results). The two module formats are in place and measured identical on the entry route: ''./add.wasm'' gives keys ["add","mem"], add(2,3) 5 and mem 65536, with no ''default'' the host does not have; a 0-byte .wasm gives the host''s "WebAssembly.Module(): BufferSource argument is empty" and a non-wasm one "WebAssembly.Module(): expected magic word 00 61 73 6d, found 65 78 70 6f @+0"; and a .ts, .mts or .cts entry runs, while an ''enum'', a ''namespace declaration'' and a ''parameter property'' in one are refused with the host''s own SyntaxError [ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX], caret span and code frame, byte-identical (cases ts_enum, ts_ns, ts_pp, ts_ok, ts_mts, ts_cts). Two things remain, both on the route the row''s witness plan names -- a main.mjs that imports the module instead of running it: (1) a .ts reached that way is not an entry, so node hands the error object and not the decorated report -- host ''ERR SyntaxError ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX'' against the container''s ''ERR Error undefined'' for both an enum and a parameter property (cases ts3, ts4); (2) a .ts whose types are not valid TypeScript at all -- ''function f<number>(1);'' -- is host ''ERR SyntaxError ERR_INVALID_TYPESCRIPT_SYNTAX "Unexpected token `numeric literal`. Expected yield, an identifier, [ or {"'' against the container''s ''ERR SyntaxError undefined "missing formal parameter"'' (case ts1), because this container''s stripper cuts the type arguments and lets what is left fail in the engine, where node''s own parser rejects the source first. Fix site for both is esmSource and loadModule in packages/core/src/process/executors/node/process.ts, which build one whole report for an entry and a bare Error for everything else; a dependency needs an error object whose name is SyntaxError, whose code is ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX or ERR_INVALID_TYPESCRIPT_SYNTAX and whose message is node''s one line. Unfixable and recorded in Readme: the host''s ''(node:<pid>) ExperimentalWarning: Importing WebAssembly module instances is an experimental feature'' (and the ''(Use `node --trace-warnings ...`)'' line behind it), which carries the pid of the printing process, and ''using x = { [Symbol.dispose]() {} }'', which is SyntaxError: expecting '';'' in QuickJS 0.32 because its grammar has no explicit resource management.'
witness_plan: 'Differential of a directory holding m.wasm, m.ts (export const v: number = 1;), m.mts, m.cts and a main.mjs importing each in turn and printing e.constructor.name, e.code and e.message (or Object.keys(m)), container against host Node 24.15.0; every line must match. Re-run d1-import-ext and r2-mts-cts in the same batch so the extensions that already match stay matched, and re-run ts_enum/ts_ns/ts_pp (a .ts entry) so the entry route stays matched.'
