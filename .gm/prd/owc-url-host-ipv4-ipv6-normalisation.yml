id: owc-url-host-ipv4-ipv6-normalisation
subject: 'URL: an IPv4 host is not normalised and an IPv6 literal is not parsed, so new URL("http://0x7f.1/").hostname is "0x7f.1" where host Node 24.15 gives "127.0.0.1"'
description: >-
  Measured 2026-10-22 (judge lane, differential container vs host Node 24.15). WHATWG host parsing
  is missing entirely: http://0x7f.1/ -> hostname '0x7f.1' (host 127.0.0.1), http://0177.0.0.1/ ->
  '0177.0.0.1', http://2130706433/ -> '2130706433', http://1.2.3.4./ -> '1.2.3.4.' (host 1.2.3.4),
  and http://4294967296/ is accepted where the host throws TypeError: Invalid URL. IPv6:
  http://[::ffff:1.2.3.4]/ serialises as 'http://[::ffff:1.2.3.4]/' where the host gives
  'http://[::ffff:102:304]/', and http://[::1%25eth0]/ is accepted where the host throws.
  Parse-side only -- setters were not measured for these. Fix belongs in parseUrl in
  guest/globals.ts (urlGlobalOf): an ends-in-dot / hex / octal / dword IPv4 parser and a bracketed
  IPv6 literal parser with zone-id rejection.
owner: lanmower
session_id: adv-judge-fetch-url-esm-4
witness_plan: >-
  Differential new URL(...).hostname and .href over the seven cases above, host Node 24.15 vs
  container; every line must match.
status: pending
