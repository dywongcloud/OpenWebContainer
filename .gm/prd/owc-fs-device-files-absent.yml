id: owc-fs-device-files-absent
description: 'SUPERSEDED 2026-10-23 by a judge (shard guest) at HEAD f5d5931. cebc45f mounted /dev/null, /dev/zero, /dev/random and /dev/urandom: fs.existsSync(''/dev/null'') is true with mode 8630 (S_IFCHR | 0666), a read of /dev/null ends at once, /dev/zero gives eight zero bytes and /dev/urandom eight that are not, and `echo hi > /dev/null` leaves 0, as on a host. Their stat shape was still wrong and is now fixed under owc-guest-stat-character-device. What is left is the size of the set -- `ls /dev` lists four names against the host''s hundreds and /dev/tty is absent -- which is one line in Readme.md. See .gm/witness-out/owc-fs-device-files-absent.txt.'
