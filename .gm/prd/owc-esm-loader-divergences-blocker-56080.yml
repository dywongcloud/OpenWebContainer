id: owc-esm-loader-divergences-blocker-56080
subject: 'ESM: an entry module with a top-level await and an object-valued export makes QuickJS abort at teardown -- Aborted(Assertion failed: list_empty(&rt->gc_obj_list), at: ../../vendor/quickjs/quickjs.c,2036,JS_FreeRuntime) on host stderr where host Node 24.15 prints nothing'
description: 'Attacked 2026-10-23 by the repair lane for shard esm (session adv7-fix-esm-11) at HEAD ceaf933, one container boot per case in isolation at load 9.5-10.9 with ~2.4 GB free. The judge left this row with no witness either way; it now has one, and it does still reproduce, narrower than the old row claimed. The trigger is the CONJUNCTION of three things and all three are needed: the file is the ES module ENTRY, it has a top-level await, and at least one of its exports holds an object. Measured 3/3 and 2/2 runs: an entry of `const v = await Promise.resolve(7);` followed by `export default class { m() { return v; } }`, by `export default { a: v }`, by `export default [v]`, or by `export const y = { a: v }`, all print Aborted(Assertion failed: list_empty(&rt->gc_obj_list), at: ../../vendor/quickjs/quickjs.c,2036,JS_FreeRuntime) on the HOST process stderr while the container''s own stdout, stderr and exit 0 are exactly the host''s. Drop any one of the three and the run is clean, 0/N: the same awaits with only primitive-valued exports (`export default 1`, `export default ''s''`, `export default null`, `export default undefined`, `export const y = v`, `export { v }`) print no assertion; an entry with a top-level await and no exports at all is clean; the same `export default class` in a module the entry imports as a DEPENDENCY is clean; a CommonJS entry whose only statement is console.log("c1") is clean, so the old row''s "every process asserts at teardown" is stale. It is NOT an engine limit: bare QuickJS 0.32 with no container in the way (quickjs-emscripten, one case per process, evalCode type module, drain jobs, dispose the promise and dispose the fulfilled promise state handle, then context.dispose and runtime.dispose) frees the runtime cleanly for every one of tla-default-class, tla-default-obj, tla-default-literal, tla-default-fn, tla-export-const, tla-noexport and the two non-TLA controls; the same probe that deliberately leaks the fulfilled promise-state handle aborts for exactly the TLA cases and not the others, which is the shape of the leak, not its site. A guest-side reference cannot outlive context.dispose -- only a host-side QuickJSHandle can keep an object on rt->gc_obj_list -- so the handle is one the host takes in the ESM entry path, and the value it holds is an exported object and not the module namespace, since a namespace exists for `export const y = v` too and that case is clean. Fix site: the boot and entry-evaluation path of packages/core/src/process/executors/node/process.ts (runEsmEntry and runEsmEval, and whatever reads the entry module''s exports there), which is outside this shard''s grant (runtime/guest/loader.ts, runtime/resolver.ts, runtime/guest/modules/*), so the row is named and not edited.'
owner: lanmower
session_id: adv7-fix-esm-11
witness_plan: 'Differential of the host process stderr around one container boot per entry: count lines matching Aborted( for (a) a CJS entry console.log("c1"), (b) an .mjs entry with a top-level await and no exports, (c) the same await with export default of a class / object literal / array, (d) the same await with export default of a number, string, null or undefined, (e) the same export default class reached as a dependency. Host Node 24.15 prints nothing on stderr and exits 0 in every case, so every Aborted( line is a divergence. Control: the same eight sources under bare QuickJS 0.32 with the promise-state handle disposed.'
status: pending
