id: owc-url-percent-encoding
subject: 'URL: non-ASCII and space are not percent-encoded on parse or on assignment, so new URL("http://h/ü").href is "http://h/ü" where host Node 24.15 gives "http://h/%C3%BC"'
description: >-
  Measured 2026-10-22 (judge lane, differential container vs host Node 24.15). The path, query and
  fragment percent-encode sets are not applied: 'http://h/ü' -> 'http://h/ü' (host 'http://h/%C3%BC')
  and 'http://h/?q=ü' likewise; u.hash = '#a b' -> 'http://h/#a b' (host '#a%20b');
  u.search = 'a b' -> '?a b' (host '?a%20b'); u.username = 'a b' -> 'http://a b@h/' (host
  'http://a%20b@h/'); u.password = 'c/d' -> 'http://:c/d@h/' (host 'http://:c%2Fd@h/'). Parsing
  'ws://x.test/a b' is the same defect, already filed under owc-url-global-normalisation; this row
  is the setter side and the non-ASCII side. Fix belongs in guest/globals.ts (urlGlobalOf): an
  encodePath/encodeComponent pass over username, password, pathname, query and hash on both parse
  and assignment.
owner: lanmower
session_id: adv-judge-fetch-url-esm-4
witness_plan: >-
  Differential href after each of the six assignments above plus the two parses, host Node 24.15 vs
  container; every line must match.
status: pending
