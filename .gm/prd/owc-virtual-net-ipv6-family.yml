  0, container run twice and identical, load 6.5-7.7 with 3.2-4.1 GB free, probes
  /tmp/owc-r4/adv11-exec-net/j-fam and j-reg. HOLDS: the mapped-loopback bind answers
  ::ffff:127.0.0.1/IPv6, takes a client dialling 127.0.0.1 (accepted as ::ffff:127.0.0.1/IPv6) and one
  dialling the mapped literal (::ffff:127.0.0.1/IPv6 at both of its own ends) and refuses ::1
  ECONNREFUSED; a bind on ::1 dialled as ::1 is IPv6 at all four of the client's values and all four of
  the server's; a scoped literal connects; and j-reg's 17 bind x dial combinations match host line for
  line. NOT FIXED, OUT OF THIS SHARD, re-measured here: dns.lookup('::1%lo0') is ENOENT here where host
  answers ::1%lo0/6, and dns.lookup('localhost') is 127.0.0.1/4 here and ::1/6 on host -- both
  packages/core/src/process/executors/node/runtime/guest/modules/dns.ts, named and not edited. No source
  change for this row in this pass.
