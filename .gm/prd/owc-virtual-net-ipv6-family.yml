witness_2026_10_24_adv12_judge: |-
  RE-VERIFIED BY THE JUDGE FOR SHARD NET (session adv12-judge-net-1) at HEAD e022edd plus this pass's
  net.ts change, differential against host node v24.15.0, one process per side, container driven by
  /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core, stdout, stderr and exit captured
  separately, every probe run twice on each side, load 4.7-10.9, probe
  /tmp/owc-r4/adv12-judge-net-1/j7-udp6zone written for this pass.
  ONE OF THE TWO THINGS THE ADVERSARY ADDED IS FIXED HERE: a udp6 socket bound on a scoped address.
  bind(21025, '::1%lo0') was EADDRNOTAVAIL here with address() throwing EBADF and no datagram
  arriving, against a host that binds (::1/21025) and receives; it now binds ::1, address() reports
  {"address":"::1","family":"IPv6","port":21025} with no zone on it, and a datagram sent to
  '::1%lo0' arrives from ::1/IPv6. One line of j7 still differs and it is the host's own ephemeral
  source port (56694 against 49152). The change is netStripZone in
  runtime/guest/modules/net.ts, applied to the address a dgram bind shows and hands the hub and to
  the destination a datagram is sent to -- a zone names which interface a link-local address means,
  not which host it is, exactly as the hub's own connect already treated it. dgram is BF['dgram']
  inside net.ts, inside this shard's grant.
  THE OTHER IS NOT THIS ROW'S AND WAS NOT RE-ATTACKED: net.setDefaultAutoSelectFamily is named and
  fixed under row owc-virtual-net in the same pass, where the value-type surface lives. The two
  dns.lookup divergences the row records stay outside the grant
  (runtime/guest/modules/dns.ts). npx tsc --noEmit clean in packages/core; pnpm build succeeds.
