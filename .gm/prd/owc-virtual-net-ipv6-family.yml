id: owc-virtual-net-ipv6-family
title: 'RESOLVED: a TCP connection to a server bound on ::1 is IPv6 on both of its ends -- client remoteFamily/localFamily/remoteAddress/localAddress and the server socket''s own two ends are all ::1/IPv6, byte-identical to host Node 24.15. Filed by the judge (adv5-judge-http2-net-5) as a fix site it did not own; fixed in hub.ts'
session_id: adv5-judge-http2-net-5
owner: adv5-fix-http2-net-5
status: closed
classification: GUEST
measured_at: bc261b63d1de325d13a96e3ab29e41aaace0ca13 (judge), 0379fed435111b08696ea7e3caf09eb7aaf57713 + the hub fix below (local main)
resolved_at: 0379fed435111b08696ea7e3caf09eb7aaf57713 + the hub fix below (local main)
body: |-
  FIXED (adv5-fix-http2-net-5) in packages/core/src/network/virtual/hub.ts, the file the judge named
  and the one this shard owns. The judge measured the divergence at bc261b6 and left it open only
  because the hub was outside its shard:

      const server = net.createServer((sock) => { ...; sock.end(); });
      server.listen(0, '::1');
      const c = net.connect({ port: addr.port, host: '::1', family: 6 });
      await once(c, 'connect');

      host node 24.15:         cli remoteFamily=IPv6 localFamily=IPv6 remoteAddress=::1 localAddress=::1
                               srv remoteFamily=IPv6 remoteAddress=::1 localAddress=::1 localFamily=IPv6
      container BEFORE:        cli remoteFamily=IPv4 localFamily=IPv4 remoteAddress=127.0.0.1 localAddress=127.0.0.1
                               srv remoteFamily=IPv4 remoteAddress=127.0.0.1 localAddress=127.0.0.1 localFamily=IPv4

  AFTER, measured on four container runs (/tmp/owc-r4/adv5-fix-http2-net-5/wit.sh, machine load
  13-26), all four identical to the host and to each other on every value above.

  The cause was the hub folding every loopback to one address before it did anything with it, and the
  change is that the fold keeps the family:
   - hubAddress() returned '127.0.0.1' for every name in LOOPBACK_NAMES, '::1' included; it now
     returns '::1' for '::1' and still returns 127.0.0.1 for 'localhost' and for 127.0.0.1, which is
     what Node's own lookup of 'localhost' reports here.
   - isLocal() refused '::1', so a bind on ::1 was EADDRNOTAVAIL; it now accepts it.
   - listen() defaulted family to 'IPv4' whatever the address, and net.listen passes no family at all
     (capabilities/net.ts, not this shard's file); it now derives the family from the address when
     the caller names none, so a '::1' bind is an IPv6 listener. dgram's bind already passed its own
     family and is unchanged.
   - connect() hardcoded the client's local address and the server's remoteAddress as '127.0.0.1' and
     searched with findEndpoint('tcp', 'IPv4', ...); the family now follows the destination, so a
     connect to '::1' is an IPv6 socket whose own address and whose peer's view of it are both '::1'.
     A wildcard listener accepts on the address that was dialled, so '::' accepts an IPv6 client on
     ::1 and an IPv4 one on 127.0.0.1.

  No regression, measured in the same runs: HTTP/1.1 (200 and body), HTTP/2 over the same hub (200
  and body), dgram udp4 on 127.0.0.1 and udp6 on ::1 both delivering their datagram with the right
  rinfo family, a connect to 'localhost' against a server bound on 127.0.0.1 (falls back to
  127.0.0.1/IPv4 after ::1 is refused, as the host does) and against a wildcard one (connects on
  ::1/IPv6), and a connect to '::1' against a server bound on 127.0.0.1, which is ECONNREFUSED on
  both sides now and was a silent cross-family connect before. `npx tsc --noEmit` clean in
  packages/core for the file touched (the only error left in the project is capabilities/crypto.ts,
  another lane's file). `pnpm build` could not be run to completion: another lane's
  src/shell/commands/builtins.ts was mid-write and unparseable at the time.

  STILL DIVERGES, FILED SEPARATELY (not confirmed by the judge, so not edited): the wildcard case.
  A server bound to '::' accepts an IPv4 client on ::ffff:127.0.0.1/IPv6 on host Node 24.15 and
  reports 127.0.0.1/IPv4 in this container -- the client's own four values agree on both sides. The
  hub cannot tell a '::' wildcard bind from a '0.0.0.0' one because both reach it as '', so the fix
  needs the bind family carried from net.listen through the capability this shard does not own
  (row owc-virtual-net-wildcard-mapped).

  Recorded in Readme.md under "Virtual net".
witness_2026_10_23_adv9: 'RE-VERIFIED 2026-10-23 by the executor for shard net (session adv9-exec-net) at HEAD 1ff048b plus this pass''''s dgram mapped fix, container driven by /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core against host node v24.15.0, one process per side, stdout/stderr/exit separate, load 6-10 with 2.2-2.9 GB free, probe /tmp/owc-r4/adv9-exec-net/p-family, SAME on two container runs (before and after this pass''''s change). The row holds: a bind on ::1 dialled as ::1 is IPv6 at all four of the client''''s values and all four of the server''''s; a bind on 127.0.0.1 dialled as 127.0.0.1 or as localhost is IPv4 at every one; dialling ::1 against a server bound on 127.0.0.1 is ECONNREFUSED; a wildcard bind accepts an IPv6 client on ::1/IPv6; udp6 on ::1 and udp4 on 127.0.0.1 each deliver their datagram with the rinfo the host reports. Nothing in this row still diverges; nothing was edited for it in this pass.'
witness_2026_10_24_adv10_judge: 'RE-MEASURED BY THE JUDGE (adv10-judge-net-3) at HEAD 99cae36: ''''nothing in this row still diverges'''' is REFUTED in isolation and the two divergences are FIXED here. Differential against host node v24.15.0, one process per side, container driven by /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core, stdout/stderr/exit separate, all four runs exit 0, every probe run twice on each side, load 6.9-8.9 with 3.6-3.9 GB free, probes /tmp/owc-r4/adv10-judge-net-3/j-fam and j-reg. (1) `server.listen(0, ''''''''::ffff:127.0.0.1'''''''')` was EADDRNOTAVAIL here (address() null, never listening) and binds on host (address() ::ffff:127.0.0.1/IPv6); the mapped-loopback escape in hub.listen was granted to UDP alone. hub.ts now admits it for either protocol, and after the change the bind answers ::ffff:127.0.0.1/IPv6, a client dialling 127.0.0.1 connects (client 127.0.0.1/IPv4, accepted socket ::ffff:127.0.0.1/IPv6), one dialling the mapped literal connects (::ffff:127.0.0.1/IPv6 at both of its own ends) and ::1 is ECONNREFUSED -- every value as host Node 24.15 reports it. (2) `net.connect({host:''''''''::1%lo0''''''''})` was ENOTFOUND here and connects on host (remote=::1/IPv6 local=::1/IPv6): netIsIPv6 now reads a zone (scope) id as part of the literal (Node''''s own isIPv6 answers 6 for ''''''''::1%lo0'''''''' and 0 for ''''''''::1%''''''''), and hub.connect strips the zone and dials the address it is attached to. j-fam after the change differs from host only in the host''''s own ephemeral ports, in two server-side lines a probe that destroys its client the instant it connects races (j-reg, which waits 40 ms, matches on all 17 rows), and in dns.lookup. NOT FIXED, OUT OF THIS SHARD: `dns.lookup(''''''''::1%lo0'''''''')` is ENOENT here where host Node 24.15 answers ''''''''::1%lo0''''''''/6 -- the site is packages/core/src/process/executors/node/runtime/guest/modules/dns.ts, named and not edited; `dns.lookup(''''''''localhost'''''''')` still answers 127.0.0.1/4 here and ::1/6 on host, which is already recorded under row owc-virtual-net-localhost-bind. No regression: j-reg re-runs the 17 bind x dial combinations this row and owc-virtual-net-wildcard-mapped were retired on (binds on the default, ::, 0.0.0.0, ::1, 127.0.0.1, localhost; dials of localhost, 127.0.0.1, ::1, ::ffff:127.0.0.1 and ::ffff:7f00:1), the dual binds in both orders, the unix path surface and dgram in both families -- all identical to host but for the host''''s own ports. Changed: listen() and connect() plus stripZone() in packages/core/src/network/virtual/hub.ts, netIsIPv6 in runtime/guest/modules/net.ts. npx tsc --noEmit clean in packages/core; pnpm build succeeds. Recorded in Readme.md under Virtual net.'
