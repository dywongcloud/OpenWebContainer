id: owc-sh-timeout-kills-grandchild
subject: 'A timeout on a `sh -c <line>` spawn kills the grandchild too: spawn(''sh'', [''-c'', ''echo shell; node busy.js''], { timeout: 400, killSignal: ''SIGKILL'' }) exits like the host at ~410 ms but closes at 408 ms with ''shell\n'' where host node 24.15 closes at 5041 ms with ''shell\nBUSY-DONE\n'''
classification: GUEST
owner: adv6-judge-child-exec-9
session_id: adv6-judge-child-exec-9
measured_at: 1e0c5e77da71238a4039828c02e56b45b913db62 (local main, with the owc-exec-abs-bin-sh-runs-nothing shell-name fix on top)
status: pending
body: |-
  Measured by the judge for shard child-exec, differentially against host node v24.15.0, one case per
  process, three runs of each, stdout / stderr / exit / close captured separately. Machine load while
  measuring 9-17 on 11 CPUs with 0.07-7.1 GB free -- a floor, not a peak, and none of the shapes below
  turns on a millisecond. Driver: a streaming variant of /tmp/owc-r4/probe2/run-owc-repo.mts (that one
  buffers child stdout and drops it when its own timer fires, so a stalled case comes back exit 0 with
  empty output), at /tmp/owc-judge-child-exec/drive.mts, run from packages/core.

    spawn('sh', ['-c', 'echo shell; node /app/w/busy.js'], { timeout: 400, killSignal: 'SIGKILL' })
    host:      exit  406 ms  code null  sig SIGKILL  killed true  out 'shell\n'
               close 5041 ms code null  sig SIGKILL  killed true  out 'shell\nBUSY-DONE\n'
    container: exit  416 ms  code null  sig SIGKILL  killed true  out 'shell\n'
               close  408 ms code null  sig SIGKILL  killed true  out 'shell\n'

  So the `exit` half of the kill deadline -- the half owc-sh-child-kill-timeout was about -- matches,
  and the `close` half does not. A host's `timeout` kills only the child it spawned: the grandchild
  `node` is never signalled, runs its 5 s out, writes BUSY-DONE into the stdout pipe it inherited and
  keeps that pipe open, which is what holds `close` back to 5041 ms. Here the bound the shell carries
  travels to the child that runs its line, so the grandchild is ended at 400 ms as well and there is
  nothing left to hold the pipe.

  The two sides agree when the line holds one command -- `spawn('sh', ['-c', 'node busy.js'],
  { timeout: 400, killSignal: 'SIGKILL' })` -- because a host's `sh` execs a last command without
  forking: the child that is killed *is* node, so there is no grandchild and no second event to differ
  over. The divergence needs a line of two or more commands, which is why the row it was measured
  under did not see it.

  FIX SITE (two files, one of them outside this shard's grant). `killDeadlineLeft` in
  packages/core/src/process/executors/shell/process.ts:291 hands the shell's remaining bound to
  whatever child the line starts, and packages/core/src/process/executors/node/process.ts:1228 adopts
  it. That propagation is what makes the bound reachable at all here -- a node child busy-looping is
  the one thing a host timer cannot interrupt -- so removing it is not a one-line change: the shell
  would also have to stop awaiting its line when the deadline fires (`execute()` at
  shell/process.ts:339 awaits `executeCommand` to completion and only then asks `deadlinePassed()`),
  which is the sibling row owc-sh-child-timeout-bound-shape. Not attempted by this judge: it is two
  behavioural changes and not one small change per symptom, and node/process.ts is the only one of the
  two this shard's grant names.
