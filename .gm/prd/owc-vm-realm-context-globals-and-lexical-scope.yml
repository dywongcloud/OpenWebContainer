title: 'A vm context has no global lexical scope and is missing globals the engine and the caller both have'
subject: 'Three symptom families of the vm realm, all measured at HEAD ee97ee0 against the same host Node v24.15.0, one container boot per case, load 10.20/16.37/19.88 with 3748 MB free, and all outside this shard''s grant. (1) Top-level let, const and class do not persist to a later run in the same context: after runInContext(''let LL = 1'') a second run reads typeof LL as ''undefined'' where the host reads ''number'', after ''const CC = 2'' a second run throws ReferenceError where the host reads 2, and after ''class KK {}'' it reads ''undefined'' where the host reads ''function''; var and function do persist and do match. Not the engine''s: under bare QuickJS 0.32 with no container in the way, two successive evalCode calls share the global lexical scope -- a let, a const and a class of the first are all still there for the second. What loses them is the wrapper the code runs in, REALM_EXEC_SRC in runtime/capabilities/vm.ts, which evals the code inside a function body, and the with scope the sandbox is handed as cannot be moved out of it. (2) Globals the caller''s realm and the engine both have are absent inside a context: typeof Float16Array, Iterator and SuppressedError are ''undefined'' in a context and ''function'' on the host, and WebAssembly is ''undefined'' in a context with naming it throwing ReferenceError where the host says ''object''; Float32Array, in the same list the caller has, is ''function'' on both. Bare QuickJS 0.32 has Float16Array and Iterator in a raw second context, so those two are not the engine''s either -- they are names the with scope''s ES list (ES_LIST in runtime/guest/modules/pure-b.ts) does not carry, so the scope shadows them and the ReferenceError branch of withHandler answers instead. SuppressedError and WebAssembly are the engine''s in a raw context and are things this container builds in the guest realm only. (3) vm.measureMemory is undefined where the host has a function. Named and not edited: the fix sites are runtime/guest/modules/pure-b.ts (ES_LIST, and the vm namespace object) and the exec path of runtime/capabilities/vm.ts, and pure-b.ts is outside this shard''s grant.'
acceptance_criteria:
- "vm.runInContext('let LL = 1', ctx) followed by vm.runInContext('typeof LL', ctx) is 'number', as on host node 24.15, and the same for const and for class"
- "typeof Float16Array, Iterator, SuppressedError and WebAssembly inside a vm context are the host's answers"
- 'typeof vm.measureMemory is ''function'''
witness_plan: 'One container boot per case, host node v24.15.0 against the container driven by /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core, comparing stdout+stderr+exit; cases at /tmp/owc-r4/judge-vm-realm-3/{lexical,globals,wasm,measuremem}, and the bare-QuickJS proofs at /tmp/owc-r4/judge-vm-realm-3/bare.mts and bare2.mts.'
