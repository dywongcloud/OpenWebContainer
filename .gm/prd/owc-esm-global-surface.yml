id: owc-esm-global-surface
description: 'Re-measured 2026-10-23 at HEAD plus the repair lane''s own edits (adv5-fix-esm-surface-0, differential container vs host Node 24.15, one container boot per case). Most of what the row was filed for now matches: Object.keys(globalThis) is 15 on both sides and the same 15 names; Object.keys(process) is 82 on both; typeof globalThis.navigator is ''object''; and every item measured since -- the accessor descriptors of performance, navigator, crypto and process, Object.getOwnPropertyNames(Crypto.prototype) (constructor, subtle, getRandomValues, randomUUID), navigator.locks, performance.onresourcetimingbufferfull, performance.toJSON() carrying eventLoopUtilization, Object.getOwnPropertyNames(SuppressedError.prototype) in the host''s order (constructor, name, message), DisposableStack.defer followed by dispose, and the .name and .length of every method of DisposableStack and AsyncDisposableStack -- is byte-identical. What is left is the count and the names: Object.getOwnPropertyNames(globalThis) is 139 here against the host''s 135. The container is missing two -- Atomics, which the engine does not have (bare QuickJS 0.32 with no container in the way answers typeof Atomics ''undefined'') and URLPattern, which is node''s own class and this container''s to write -- and carries six of its own on top: __owcErrname, __owc_api, __owc_importArg, __owc_importMeta, __owc_importWrap and __owc_moduleView, the bridge the host calls into, which no guest of node''s ever sees. Fix site for URLPattern and for hiding the bridge is runtime/guest/globals.ts; Atomics is the engine''s.'
