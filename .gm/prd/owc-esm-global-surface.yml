subject: 'ESM: the enumerable global surface is not Node''s -- Object.keys(globalThis).length is 27 here where host Node 24.15 gives 15, and Object.getOwnPropertyNames(globalThis) is 122 against 135'
witness_plan: Differential of Object.keys(globalThis).sort(), Object.getOwnPropertyNames(globalThis).sort() and Object.keys(process).sort(), plus typeof globalThis.navigator, container against host Node 24.15; every line must match.
witness: 'Case /tmp/owc-judge-esm3/cases/g1 (main.js) and g4 (main.mjs), host node v24.15.0 against the container at the judge''s fix, one boot each. g1: count=134 against 135, the two name lists differing by Atomics alone; enumKeys identical 15; procKeys identical 83; navigator=object; processDesc={"get":"function","set":"function","value":"undefined","e":false,"c":true} on both. g4: node:url''s URLPattern is a function on both, globalThis.URLPattern a function on both, and process.mainModule correctly absent for an .mjs entry on both.'
