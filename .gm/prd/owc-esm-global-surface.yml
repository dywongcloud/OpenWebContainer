id: owc-esm-global-surface
description: 'Measured 2026-10-23 (judge lane, shard esm, differential container vs host Node 24.15, each case run twice with identical results). Object.keys(globalThis).length: 27 container, 15 host. The container makes Blob, Buffer, URL, URLSearchParams, console, process, TextEncoder, TextDecoder, AbortController, AbortSignal, File and CloseEvent enumerable where the host keeps them non-enumerable, leaks __owcErrname as an enumerable global, and has no navigator at all (typeof globalThis.navigator is ''undefined'' against the host''s ''object''). Object.getOwnPropertyNames(globalThis): 122 against 135; the container is missing Atomics, Crypto, CryptoKey, SubtleCrypto, Navigator, navigator, the Performance family, BroadcastChannel, CompressionStream, DecompressionStream, URLPattern, DisposableStack, AsyncDisposableStack and SuppressedError, and adds InternalError plus six __owc_* internals. Object.keys(process) is 45 against 82, with stdout/stdin/stderr non-enumerable on the container side. Fix belongs in the guest globals (runtime/guest/globals.ts and the __owc_* bridge), not in resolver.ts.'
