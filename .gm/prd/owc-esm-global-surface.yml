id: owc-esm-global-surface
description: 'Re-measured 2026-10-23 by the judge for shard esm-surface (session adv6-judge-esm-surface-3), container against host Node 24.15, one container boot per case, in isolation at load 7-10 (1-minute) with 8 GB free. The four lines of the witness plan all match: Object.keys(globalThis).sort() is the host''s 15 names byte for byte, Object.keys(process).sort() is the host''s 83 (''mainModule'' included, which the CommonJS entry sets and an ES module entry still leaves off, as on the host), typeof navigator is ''object'', and Object.getOwnPropertyNames(globalThis) is 134 against the host''s 135 -- the two sorted lists differ by Atomics alone. URLPattern is written, as the class node:url exports and non-enumerable as the host has it: globalThis.URLPattern is a function and not undefined. The six __owc_* names of the host bridge -- __owc_api, __owcErrname, __owc_importArg, __owc_importMeta, __owc_importWrap and __owc_moduleView -- are no longer own names of globalThis: they stand as accessors on an object behind the global object, whose setter keeps the value beside it, so a lookup (and an assignment, which is how the loader and the generated module code reach them) still finds them and a walk of the global object''s own names does not. Node''s process is an accessor pair on the global object, so it is one here: Object.getOwnPropertyDescriptor(globalThis, ''process'') reads a get and a set and no value, non-enumerable and configurable, on both sides. One consequence of the move: Object.getPrototypeOf(globalThis) is no longer Object.prototype but an object whose only own name is ''constructor'', which is what the host''s walk finds too; one step behind that stands the bridge, so the object two steps out is not Object.prototype where the host''s is. Atomics is the engine''s: bare QuickJS 0.32 with no container in the way answers typeof Atomics ''undefined'' and lists SharedArrayBuffer but not Atomics among the global object''s own names, so there is no atomics object here to put on the global object. That one line is recorded in Readme.md.'
