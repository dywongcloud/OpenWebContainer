subject: 'crypto.generateKeyPairSync(''rsa'', { modulusLength: 2048 }) throws ERR_CRYPTO_UNSUPPORTED_OPERATION here (''rsa key generation is not available: this runtime has no large-prime search'') where host Node 24.15 answers a key pair whose publicKey.asymmetricKeyType is ''rsa''. Ed25519, X25519, Ed448, X448 and the four EC curves (prime256v1, secp384r1, secp521r1, secp256k1) generate, import, export and sign correctly as of owc-crypto-asymmetric-and-hashes; RSA, DSA and the ''dh'' key type do not, because generating one needs a search for two large random primes (a 2048-bit key needs two 1024-bit probable primes, which a Miller-Rabin search in BigInt reaches only in seconds. ADJUDICATED adv5-judge-crypto-4: a speed gap and an unimplemented surface, NOT an engine limit -- bare QuickJS 0.32 with no container does a 1024-bit BigInt modPow with an all-ones exponent in 22.3 ms against V8's 4.5 ms, same result b2bffc4a, so the search is reachable at roughly 5x slower. The row covers DSA and DH too: generateKeyPairSync('dsa', {modulusLength:1024}) and generateKeyPairSync('dh', {primeLength:1024}) throw that same error here and answer keys on host) plus PKCS#1 padding for sign/verify and privateEncrypt/publicDecrypt. The fix site is generatePair in packages/core/src/process/executors/node/runtime/capabilities/crypto.ts, and the guest''s KeyObject in packages/core/src/process/executors/node/runtime/guest/misc.ts.'
