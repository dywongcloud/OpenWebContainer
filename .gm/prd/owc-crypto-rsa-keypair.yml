subject: 'crypto.generateKeyPairSync(''rsa'', { modulusLength: 2048 }) throws ERR_CRYPTO_UNSUPPORTED_OPERATION here (''rsa key generation is not available: this runtime has no large-prime search'') where host Node 24.15 answers a key pair whose publicKey.asymmetricKeyType is ''rsa''. Ed25519, X25519, Ed448, X448 and the four EC curves (prime256v1, secp384r1, secp521r1, secp256k1) generate, import, export and sign correctly as of owc-crypto-asymmetric-and-hashes; RSA, DSA and the ''dh'' key type do not, because generating one needs a search for two large random primes (a 2048-bit key needs two 1024-bit probable primes, which a Miller-Rabin search in BigInt reaches only in seconds) plus PKCS#1 padding for sign/verify and privateEncrypt/publicDecrypt. The fix site is generatePair in packages/core/src/process/executors/node/runtime/capabilities/crypto.ts, and the guest''s KeyObject in packages/core/src/process/executors/node/runtime/guest/misc.ts.'
