id: owc-domain-unhandled-rejection-prefers-process
title: "RESOLVED: an unhandled rejection a domain owns goes to that domain whether or not it listens, as on host node 24.15"
classification: GUEST
session_id: adv7-judge-domain-10
owner: adv7-judge-domain-10
status: completed
resolved_by: adv7-judge-domain-10
resolved_at: HEAD + the rejection-tracker fix in process.ts (adv7-judge-domain-10)
subject: 'takeUnhandledRejection in packages/core/src/process/executors/node/process.ts asked whether the owning domain had an error listener and, when it had none, handed the rejection to a process unhandledRejection listener instead. Host node 24.15 does neither: lib/internal/process/promises.js emits the reason as an error event on the domain that owns the promise unconditionally, and an error event with no listener is the fatal "Unhandled ''error'' event on Domain instance", exit 1 with nothing on stdout, so a process unhandledRejection listener never hears it. Measured: r03 (a .then reaction that throws) and r10 (a plain Promise.reject), both with a process unhandledRejection listener and a domain with no error listener -- host stdout empty, stderr "Unhandled ''error'' event on Domain instance" plus "Emitted ''error'' event on Domain instance at: emitUnhandledRejection", exit 1; container UNHANDLED=... / stack=1 / late=yes, exit 0.'
acceptance_criteria:
- 'r03 and r10 print nothing on stdout and exit 1, as host node 24.15 does'
- 'r01, r02, r05 and r08 still agree: a domain that listens gets the error, a rejection no domain owns still goes to a process unhandledRejection listener, and a domain that was never entered owns nothing'
witness_plan: Run /tmp/owc-r4/judge-domain-10/cases/r03-reaction-throw-no-domain-listener and /tmp/owc-r4/judge-domain-10/cases5/r10-promise-reject-in-domain-no-listener under host node 24.15 and in the container via /tmp/owc-r4/probe2/run-owc-repo.mts from packages/core and diff stdout, stderr and exit code.
body: |-
  VERIFIED AND FIXED (adv7-judge-domain-10). Re-run in isolation on both sides; the two cases were
  run twice each on the container and came back byte-identical. Load 9.6-50.4, free 52 MB - 2.8 GB.

  Before: r03 container stdout UNHANDLED=reaction-no-listener / stack=1 / pd=[object Object] / late=yes,
  exit 0, against host stdout empty and stderr "Unhandled 'error' event on Domain instance", exit 1;
  r10 the same shape. After: both print nothing on stdout, write the error to stderr and exit 1 --
  stdout and exit code now match, and what is left of stderr is the fatal-stack shape the engine
  owns (no source line, no caret, no Node.js v24.15.0 trailer), recorded in Readme.md.

  The same edit drops an annotation host node does not make: this route never reaches
  Domain.prototype._errorHandler, so err.domain and err.domainThrown stay undefined in the handler a
  rejection reaches. Measured on host node 24.15 (probe/rej-annot): err-domain-is-d=false and
  domainThrown=undefined, which the container now matches.
