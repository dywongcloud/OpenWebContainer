id: owc-domain-idle-process-domain-value
subject: 'The value the process settles on once the uncaught route has finished is null here where host node 24.15 reads it and undefined in an ordinary leave: with a domain 'error' listener, setTimeout(() => P('pd', String(process.domain)), 10); d.run(() => { throw new Error('z'); }); prints DOMAIN=z / pd=null / active=null / capture=false / stack=0 on host node 24.15 and pd=undefined / active=undefined here. It is not the leave itself -- after d.enter(); d.exit() (x02), after a d.run() that returns (x03) and before any domain exists (x01) both sides agree, undefined for the first two and null for the last -- and inside the domain's own 'error' handler both sides read undefined (q9 pd-inside, t05 pd-in-handler). What diverges is only the value lib/domain.js leaves behind: _errorHandler ends with domainUncaughtExceptionClear(), stack.length = 0 and exports.active = process.domain = null, and the fall-through route runs the same clear as a prepended 'uncaughtException' listener. Fixed in uncaughtInDomain in modules/pure-b.ts.'
description: 'Measured against host node 24.15 while closing the three domain rows. `const d = domain.create(); d.on(''error'', e => P(''DOMAIN'', e.message)); setTimeout(() => { P(''pd'', String(process.domain)); P(''active'', String(domain.active)); P(''capture'', String(process.hasUncaughtExceptionCaptureCallback())); P(''stack'', String(domain._stack.length)); }, 10); d.run(() => { throw new Error(''z''); });` prints `DOMAIN=z / pd=null / active=null / capture=false / stack=0` on host node 24.15 and `DOMAIN=z / pd=undefined / active=undefined / capture=false / stack=0` in this container. It is not the leave itself: inside the domain''s own ''error'' handler both sides read "undefined" (q9 prints `pd-inside=undefined` on the host too), so what diverges is the value the process settles on once the uncaught route has finished -- host node puts null back after the domain is off the stack, this container leaves undefined. Site: setActive in packages/core/src/process/executors/node/runtime/guest/modules/pure-b.ts, which assigns `process.domain = d` with d undefined when the enter/exit stack empties; globals.ts seeds proc.domain = null, so the idle value is right until a domain is actually left. Not fixed in the domain shard because the two readings are one route apart -- the handler must see undefined and the process must settle on null -- and nothing measured yet says at which point node puts null back (a later timer sees null; a later tick and the synchronous statement right after the route were not measured), so the change needs that point pinned first.'
acceptance_criteria:
- '`setTimeout(() => P(''pd'', String(process.domain)), 10); d.run(() => { throw new Error(''z''); })` with a domain ''error'' listener prints pd=null, as host node 24.15 does'
- Inside the domain 'error' handler `String(process.domain)` is still "undefined", as it is now and as host node 24.15 has it
witness_plan: Run /tmp/owc-r4/adv7-domain/cases/q12/main.js and /tmp/owc-r4/adv7-domain/cases/q9/main.js under host node 24.15 and in the container via /tmp/owc-r4/probe2/run-owc-repo.mts from packages/core and diff stdout, stderr and exit code; host prints pd=null (q12) and pd-later=null (q9), this container prints undefined for both, while pd-inside is undefined on both.
