subject: '`process.kill(process.pid, ''SIGUSR1'')` ends the process with exit 143 (128+15) even when a handler was registered for SIGUSR1: the output stops right after the line printed before the kill, `sent SIGUSR1` and the handler''s own line never come, and a timer due 120 ms later never fires. Host Node 24.15 prints `sent SIGUSR1`, then `handler SIGUSR1`, then `survived, got= SIGUSR1`, and exits 0. Reproduced twice with byte-identical output on both sides, one case per process. Registering SIGUSR1, SIGUSR2, SIGINT, SIGTERM and SIGHUP succeeds on both. `process.kill(process.pid)` with no signal ending the process at 143 is Node''s own behaviour and does match; what does not is a named signal reaching a handler instead of ending the process.'
body: |-
  RE-MEASURED AT HEAD (local main c15e75b7a5b0d8eb2c2ebe51046335c02638e614), still diverging, same
  shape and same numbers. The case, one process per side:

      var got = null;
      process.on('SIGUSR1', function () { got = 'SIGUSR1'; console.log('handler SIGUSR1'); });
      process.on('SIGUSR2', ...); process.on('SIGINT', ...);
      process.on('SIGTERM', ...); process.on('SIGHUP', ...);
      console.log('registered');
      process.kill(process.pid, 'SIGUSR1');
      console.log('sent SIGUSR1');
      setTimeout(function () { console.log('survived, got=', got); }, 120);

      host node 24.15:  registered / sent SIGUSR1 / handler SIGUSR1 / survived, got= SIGUSR1, exit 0
      container:        registered, exit 143

  So all five registrations succeed on both sides and the divergence is exactly one branch.

  FIX SITE (a file this shard does not own): packages/core/src/process/executors/node/runtime/guest/globals.ts,
  the self-pid branch of `proc.kill` (around line 411):

      if (num === proc.pid) {
          proc.exit(128 + (LETHAL_SIGNALS[name] === undefined ? 15 : LETHAL_SIGNALS[name]));
          return true;
      }

  It ends the process unconditionally, so SIGUSR1 lands as 128+15 when no handler was consulted. Node
  runs a registered handler instead of ending the process, and only ends it with 128+N for a signal
  name no handler was registered for -- and SIGKILL and SIGSTOP cannot be caught at all. The branch
  therefore has to ask the process object for listeners on the signal's name before it exits, and emit
  the name when one is there; `process.on('SIGUSR1', ...)` already registers it, which is why the
  registration half of this row matches. Note globals.ts is a guest source carried in a String.raw
  template, so no backtick may appear in any comment written into it.
