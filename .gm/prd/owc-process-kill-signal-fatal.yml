subject: |-
  `process.kill(process.pid, 'SIGUSR1')` ends the process with exit 143 (128+15) even when a handler was registered for SIGUSR1: the output stops right after the line printed before the kill, `sent SIGUSR1` and the handler's own line never come, and a timer due 120 ms later never fires. Host Node 24.15 prints `sent SIGUSR1`, then `handler SIGUSR1`, then `survived, got= SIGUSR1`, and exits 0. Reproduced twice with byte-identical output on both sides, one case per process. Registering SIGUSR1, SIGUSR2, SIGINT, SIGTERM and SIGHUP succeeds on both. `process.kill(process.pid)` with no signal ending the process at 143 is Node's own behaviour and does match; what does not is a named signal reaching a handler instead of ending the process.
