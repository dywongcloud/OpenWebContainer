id: owc-module-globalpaths-empty
detail: 'packages/core/src/process/executors/node/runtime/guest/loader.ts sets Module.globalPaths = []. Host Node 24.15 fills it from _initPaths (3 entries on darwin: $HOME/.node_modules, $HOME/.node_libraries, $PREFIX/lib/node). Measured: Module._resolveLookupPaths(''demo'', parent) returns 1 entry here against the host''s 4 (parent.paths + 3 globalPaths), and with no parent null here against the host''s 3. Outside the module-table shard grant (misc.ts); the lookup-paths function itself was corrected in misc.ts to send a non-string request to the bare-name branch as host does.'
status: open
re_witnessed_at: ef30294 (local main)
route_to: a lane owning packages/core/src/process/executors/node/runtime/guest/loader.ts
title: Module.globalPaths is empty, so _resolveLookupPaths omits the global folders
session_id: adv6-judge-module-table-4
owner: adv6-judge-module-table-4
body: |-
  STILL OPEN, re-witnessed by adv7-fix-module-misc-12 at local main HEAD ef30294. Host node v24.15.0
  against the container, /tmp/owc-r4/mm12-fix/b-modpaths/main.js on both sides (machine while
  measuring: load 9.5, 356 MB free; cross-checked against the independent adv7 judge witness at
  /tmp/owc-r4/judge-mm12/b-modpaths, byte-identical). Not edited: the site is
  packages/core/src/process/executors/node/runtime/guest/loader.ts, outside the module-misc grant.

  Everything measured at HEAD, container against host:
   - Module.globalPaths: 0 entries against 3 ($HOME/.node_modules, $HOME/.node_libraries,
     $PREFIX/lib/node). Site: loader.ts:253 `Module.globalPaths = []`, and loader.ts:260
     `Module._initPaths = function _initPaths() { return undefined; }`, a no-op where Node fills
     the array from the home directory and the install prefix.
   - Module._resolveLookupPaths('demo', parent): 1 entry against 4 (parent.paths + 3 globalPaths);
     with no parent, null here against the host's 3. The lookup-paths function itself, in
     guest/misc.ts, is correct and already sends a non-string request to the bare-name branch as
     the host does -- it reads Module.globalPaths and gets an empty array.
   - require.resolve.paths('demo'): TypeError: not a function here against the host's 9-entry
     array. Site: createRequireFor at loader.ts:1175, which builds a require with no resolve.paths.
   - module.paths: 2 entries here against the host's 6, the host walking the real cwd's ancestors
     to /. Part of that is structural rather than a code gap: /app is the top of this container's
     file system, so there is nothing above it to walk, and the ancestor walk cannot name the host
     paths the project directory really sits under. The 3 global folders are not, and are what
     filling globalPaths would add.
