- sharp(40x30x3 raw).resize({width:20,height:10,fit:'cover',position:'attention'}).raw() is 600 bytes hashing 3258133504, as under host sharp 0.33.5
- sharp(40x30x3 raw).resize({width:100,height:10,position:'entropy'}).raw() is 3000 bytes hashing 3554635574
- the same two report cropOffsetLeft/cropOffsetTop the way host does
