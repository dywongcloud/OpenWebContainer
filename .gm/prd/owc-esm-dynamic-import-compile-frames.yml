id: owc-esm-dynamic-import-compile-frames
subject: 'ESM: an uncaught dynamic import of a module that will not compile prints the loader frames of a LINKED dependency (at ModuleJob.syncLink / at ModuleJob.link) where host Node 24.15 prints those of a load it started (at node:internal/modules/esm/loader:628:32 / at TracingChannel.tracePromise)'
description: 'Re-verified 2026-10-23 by the repair lane for shard esm (session adv7-fix-esm-11) at HEAD ceaf933, container against host Node 24.15, one boot per case in isolation at load 9.5-10.9. Confirmed with the two shapes that carry Node''s own report: an entry of `await import(''./dep.mjs'')` where dep.mjs holds `const a = 1; const a = 2; export { a };` prints, on the host, SyntaxError: Identifier ''a'' has already been declared with the caret under dep.mjs:2 and the frames `at node:internal/modules/esm/loader:628:32` and `at TracingChannel.tracePromise (node:diagnostics_channel:362:14)`, while the container prints the same file, line, source line, caret, constructor, message and exit 1 and differs in exactly the last two frames, `at ModuleJob.syncLink (node:internal/modules/esm/module_job:162:33)` and `at ModuleJob.link (node:internal/modules/esm/module_job:252:17)`. The same with a duplicate import binding (`import { p } from ''./y.mjs''` twice) diverges identically. Both controls match byte for byte: the same dep.mjs pulled in by a STATIC `import ''./dep.mjs''` prints syncLink on both sides, so the container is right for a linked dependency and wrong only for a dynamic import. Two further sub-symptoms of the same area, measured at the same HEAD and not previously recorded: (1) `await import(''./bad.mjs'')` over `export const a = ;` -- a body the engine itself refuses to parse rather than a duplicate binding the container diagnoses -- prints the host''s full fourteen-line report with loader:628:32 and TracingChannel, but here prints only two lines, `SyntaxError: unexpected token in expression: '';''` and `    at /app/bad.mjs:1:18`, with no code frame, no loader frames and no version trailer. (2) the STATIC control over that same bad.mjs attributes the error to the wrong file: the host reports bad.mjs:1 with syncLink and link, and the container reports `file:///app/main.mjs:1` over the line `import ''./bad.mjs'';` with loader:628:32 and TracingChannel -- the whole graph the entry imports is resolved and evaluated inside one evalCode call, so a dependency''s compile failure surfaces as the entry''s, and isMain is true for it. The judge''s reasoning that there is no signal holds for the shape of the code as it stands: a static import and a dynamic import both reach the engine''s module loader through the same callback (loadModule in process.ts), because prepareEsmSource rewrites `import(spec)` to `globalThis.__owc_importWrap(import(globalThis.__owc_importArg(spec, file)))` and leaves the engine''s own `import` in place, so at the point esmSource runs the two are indistinguishable. A signal is still available in principle -- `__owc_importArg` runs on the host immediately before the engine evaluates the import and could mark the next loadModule call as the root of a load -- but every half of that is in packages/core/src/process/executors/node/process.ts (prepareEsmSource, loadModule, esmSource, esmCompileFrames), which is outside this shard''s grant (runtime/guest/loader.ts, runtime/resolver.ts, runtime/guest/modules/*), so the row is named and not edited.'
