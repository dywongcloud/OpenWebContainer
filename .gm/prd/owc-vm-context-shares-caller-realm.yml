id: owc-vm-context-shares-caller-realm
session_id: adv5-judge-napi-vm-9
owner: adv5-judge-napi-vm-9
status: pending
classification: GUEST
measured_at: ebdf467 (local main)
title: 'A vm context shares the caller''s realm: a value handed IN is still of the caller''s intrinsics inside it'
subject: 'The code of a `vm` context runs in the caller''s own realm, so a value the caller puts into a sandbox keeps its identity there: `vm.runInNewContext(''e instanceof Array'', { e: [1] })` is `true` here and `false` on host Node 24.15, and so are `e instanceof Date` for a Date, `e instanceof Object` for a plain object, and `e instanceof Error`, `e.constructor === Error` and `Object.getPrototypeOf(e) === Error.prototype` for an Error. `Array.isArray(e)` and `Object.prototype.toString.call(e)` agree on both, because those do not ask which realm the value is of. A value BORN inside the context agrees on both (`([]) instanceof Array` is `true` here and on the host). The second realm this container keeps is only ever used to rebuild what a context hands back OUT, so the inward half of a context''s isolation does not exist. Not an engine limit: quickjs-emscripten gives each context its own intrinsics and capabilities/vm.ts already makes a second one; what would have to change is where the context''s code is compiled and run.'
acceptance_criteria:
- 'vm.runInNewContext(''e instanceof Array'', { e: [1] }) is false here, as on host node 24.15'
- 'vm.runInNewContext(''e instanceof Error'', { e: new Error(''x'') }) is false here'
- 'Everything a context returns or throws still crosses: the owc-vm-error-thrown-realm and owc-vm-realm-map-set-promise-instanceof measurements do not regress'
witness_plan: One container boot per case, host node v24.15.0 against the container driven by /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core. Already witnessed at /tmp/owc-j9-napivm/cases/v1-inward (host.stdout and v1-inward.ct.out) and in the `in.*` keys of /tmp/owc-j9-napivm/cases/v8-regress.
judge_note: |
  REOPENED, not closed (JUDGE, shard vm-realm, session adv7b-judge-vm-realm-3, at HEAD ee97ee07a2287ef34d0548a48b70a13eccbd5bd8, differential against the same host Node v24.15.0, one container boot per case, load 10.20/16.37/19.88 with 3748 MB free). The single-context half of this row does hold. The multi-context half does not, and it is this row's own subject: with two contexts in one process every probe answers true here and false on the host -- runInContext('Object', A) === runInContext('Object', B), A.arr instanceof B.Array, A.err instanceof B.Error, A.map instanceof B.Map, a value made in A and read as 'fromA instanceof Array' inside a third context, an error out of A read as 'instanceof Error' inside a fourth, and a second Object comparison after all of that. Container stdout is seven true lines, host stdout the same seven keys false. Bare QuickJS 0.32 proves this is not the engine: two contexts of one runtime have intrinsics of their own, Object of A !== Object of B. It is VmHost.realm in packages/core/src/process/executors/node/runtime/capabilities/vm.ts being one second context per binding rather than one per vm context, and realmOf() handing that same one to every context; a per-context realm also needs the guest's single cached esRealm (realmEs in runtime/guest/modules/pure-b.ts) to become per-context, or '[] instanceof Array' inside a context regresses. Site named, not edited: pure-b.ts is outside this shard's grant.
