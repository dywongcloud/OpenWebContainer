  0, load 6.5-7.7 with 3.2-3.8 GB free, probes /tmp/owc-r4/adv11-exec-net/pa-buf (re-run) and
  j-writehost, each run twice on each side. Both halves stay STALE on the witness the earlier waves
  recorded, and neither moved: the count is 19 lines different (this side 13107200 at t0 and 0 from
  t60, host 12648448/12845056 at t0 and holding 12779520 at t600 -- the host's own figure moves with
  ITS OWN run, as it did twice within this pass), and write()'s return value is 7 lines different
  (false from the first 65536-byte write here, TTTTFFFF on host). It is one missing piece and it is not
  reachable from the two files this shard owns: a host's write stalls on a bounded send buffer and this
  hub accepts every byte; a faithful count needs the peer to report its own consumption back to the
  hub, and no net.* capability carries that
  (packages/core/src/process/executors/node/runtime/capabilities/net.ts); the engine is not the wall,
  since bare QuickJS 0.32 does allow a host call into the guest while the guest is calling out but will
  not run the guest's own pending jobs there; and holding the write callback back until the hub's
  outstanding bytes fall would lose bytesWritten=13107200, the figure this side matches host on. The one
  line that differs between the two container runs of this pass is F.cbAfter 0ms against 1ms, a
  millisecond timing that jitters the same way on the host. No source change for this row in this pass;
  the same two lines stand in Readme.md.
