witness_2026_10_24_adv12_judge: |-
  RE-VERIFIED BY THE JUDGE FOR SHARD NET (session adv12-judge-net-1) at HEAD e022edd, differential
  against host node v24.15.0, one process per side, container driven by
  /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core, stdout, stderr and exit captured
  separately, every probe run twice on each side, load 4.7-6.0, probe
  /tmp/owc-r4/adv12-judge-net-1/j9-buf written for this pass. STALE on the witness the earlier waves
  recorded, and unchanged by this pass: the count still cannot be one number that is 0 while the peer
  is reading and ~12.8M while it is not, no net.* capability carries a peer's own consumption back to
  the hub, the engine is not the wall, and the host's own peak moves with its own run.
  What the row had not recorded, and what this pass measured in isolation, is the NEW SHAPE the
  adversary named: the counter OVER-reports where the host reads 0. 400 writes of 1 KiB into a peer
  the server paused is grew=false max=0 on host and grew=true max=409600 here; with a peer that reads
  eagerly the host reads [0,0,0,0,65536,131072,...] where this side reads [65536,131072,...] from the
  first write; and ten single bytes count 1..10 here against 0 there. All three on both container
  runs, byte-identical. So the row's own sentence "writableLength never grows" no longer describes
  it: bufferSize here is this socket's own un-flushed queue, not the peer's, and one net.ts-side rule
  cannot be both figures. Readme.md amended under Virtual net to say so. No source change for this
  row; the site stays packages/core/src/network/virtual/hub.ts and
  runtime/capabilities/net.ts, outside this shard's grant (runtime/guest/modules/net.ts).
