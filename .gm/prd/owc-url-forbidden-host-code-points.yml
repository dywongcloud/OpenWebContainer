id: owc-url-forbidden-host-code-points
subject: 'URL: a host containing a forbidden code point is accepted, so new URL("http://a b/").href is "http://a b/" where host Node 24.15 throws TypeError: Invalid URL'
description: >-
  Measured 2026-10-22 (judge lane, differential container vs host Node 24.15). new URL('http://a b/')
  parses to 'http://a b/' where the host throws TypeError: Invalid URL, and new URL('http://h%41/')
  .hostname is 'h%41' where the host gives 'ha' (a percent-escape in a host is decoded). Two more
  parse gaps in the same area: u.protocol = 'javascript:' on an http URL keeps the host
  ('javascript://h/x' vs host 'http://h/x'), and new URL('http:h', 'http://c/d') ignores the base
  ('http://h/' vs host 'http://c/h') because a scheme-only special reference is not resolved against
  it. Fix belongs in parseUrl and the protocol setter in guest/globals.ts (urlGlobalOf).
owner: lanmower
session_id: adv-judge-fetch-url-esm-4
witness_plan: >-
  Differential href/hostname over 'http://a b/', 'http://h%41/', the javascript: protocol setter and
  the 'http:h' against base case, host Node 24.15 vs container; every line must match.
status: pending
