id: owc-url-module-legacy-api
subject: 'url: require("url").domainToASCII and domainToUnicode do not exist, Url is missing, fileURLToPath takes any host and parse writes a stray "=" before the fragment'
description: >-
  Measured 2026-10-22 (judge lane, differential container vs host Node 24.15). The url module's
  non-WHATWG surface is thin: url.domainToASCII('пример.рф') and
  url.domainToUnicode('xn--e1afmkfd.xn--p1ai') throw 'TypeError: not a function' where the host
  returns the punycode/Unicode forms; url.Url is undefined where the host has the legacy
  constructor; url.fileURLToPath('file://host/a') returns '/a' where the host throws
  'TypeError: File URL host must be "localhost" or empty on darwin'; and
  url.parse('http://u:p@h:8080/p?q#f').href is 'http://u:p@h:8080/p?q=#f' -- a stray '=' before the
  fragment -- where the host gives 'http://u:p@h:8080/p?q#f'. Fix belongs in guest/misc.ts (BF.url);
  domainToASCII/domainToUnicode need a punycode table.
owner: lanmower
session_id: adv-judge-fetch-url-esm-4
witness_plan: >-
  Differential require('url') over domainToASCII, domainToUnicode, typeof Url, fileURLToPath and the
  parse href case, host Node 24.15 vs container; every line must match.
status: pending
