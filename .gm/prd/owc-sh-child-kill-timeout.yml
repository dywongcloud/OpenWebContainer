id: owc-sh-child-kill-timeout
title: 'A `sh` child ignores the `timeout` (and `killSignal`) of the spawn that started it: ShellProcess carries no armKillDeadline, so spawn(''sh'', [''-c'', busy], { timeout: 400, killSignal: ''SIGKILL'' }) closes at 5659 ms with code 0 and killed false where host node 24.15 closes at 5078 ms with code null and SIGKILL'
body: |-
  Measured at HEAD (local main c15e75b7a5b0d8eb2c2ebe51046335c02638e614) differentially against host
  node v24.15.0, container driven by /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core; machine
  load 30 on 11 CPUs, so the millisecond figures are a floor.

  A `node` child's `timeout` was fixed in the same pass (see owc-child-kill-timeout): NodeProcess now
  has armKillDeadline, which hands the spawn's deadline to the guest's interrupt handler -- the only
  thing that runs while guest code holds the host thread -- and capabilities/child.ts calls it in
  startProcess's beforeStart. A `sh` child gets neither, because ShellProcess has no such method and
  the duck-typed call in beforeStart finds nothing to call:

      spawn('sh', ['-c', 'echo shell; node -e "<busy 5 s>"'], { timeout: 400, killSignal: 'SIGKILL' })
      host:  OUT:shell / close at 5078 code null signal SIGKILL killed true
      owc:   OUT:shell / close at 5659 code 0    signal null    killed false

  FIX SITE (not owned by the shard that found this): packages/core/src/process/executors/shell/process.ts.
  ShellProcess needs the same armKillDeadline NodeProcess has -- or, better, the mechanism wants to
  live once where every process can carry it, because the same gap will open for the npm executor.
  A shell whose command line blocks holds the host thread exactly as a node child does, so a host
  timer cannot end it either: without a bound the interrupt handler can see, the child runs to the end.
