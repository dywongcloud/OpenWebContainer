id: owc-vm-realm-rebuild-drops-keys
session_id: adv5-judge-async-als-3
owner: adv5-judge-napi-vm-9
status: completed
classification: GUEST
measured_at: af9e76d (local main)
resolved_at: ebdf467 + the fix below (local main)
title: 'RESOLVED: a value rebuilt for a vm realm no longer loses every key after its second nested container'
subject: 'A value a vm context hands back is copied into the second realm by rehomeInto, and the copy stops at the second child that is itself an object or an array, dropping that child and every key after it.'
body: |-
  JUDGED AND RESOLVED (adv5-judge-napi-vm-9) at HEAD ebdf467. Re-confirmed first in isolation, one
  container boot per case, host node v24.15.0 against the container driven by
  /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core.

  The diagnosis in this row was exact and I reproduced it independently: rehomeInto keeps each source
  handle it has walked in `seen`, but the caller disposed that handle in a `finally` the moment
  setProp had taken it, so `seen` held freed handles and the next `context.eq(seen[i], value)` threw
  "Lifetime not alive". The instrumented run printed it on stderr:
      [DBG] setProp failed depth=0 key=b err=Lifetime not alive
      [DBG] keyloop aborted depth=0 err=Lifetime not alive

  FIX: packages/core/src/process/executors/node/runtime/capabilities/vm.ts. The child handle is no
  longer disposed by the caller; it is pushed onto a `kept` list threaded through the recursion and
  freed once the whole rebuild is over, so every entry `seen` can still be compared against is alive.
  This also fixes the Error-valued form of the same symptom
  (vm.runInNewContext('({e:new Error("a"), f:new Error("b")})') lost `f`).

  After the fix, one container run, host vs container:
      ({a:{z:1},b:{y:2}})        host 'a,b'          container 'a,b'   (was 'a')
      [{a:1},{b:2}].length       host 2              container 2       (was 1)
      [[1],[2]]                  host '[[1],[2]]'    container '[[1],[2]]'  (was '[[1]]')
      ({a:1,b:2,c:3})            host 'a,b,c'        container 'a,b,c'
  A cycle is still handled: ({a:{}}) with a.a = a comes back with a.a === the value, as on the host.
  A 42-case regression sweep over the whole vm realm surface (arrays, plain objects, nesting, Date,
  RegExp, Error, TypeError, the standard globals, Map/Set/Promise, functions, Symbol keys, timeout,
  isContext, a sandbox round trip) is byte-identical to the host except the pre-existing
  owc-vm-realm-map-set-promise-instanceof and owc-vm-context-shares-caller-realm.
  `npx tsc --noEmit` clean in packages/core and `pnpm build` green.
