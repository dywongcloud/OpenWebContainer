id: owc-module-stat-enotdir-for-file-parent
detail: 'fs.statSync in packages/core/src/process/executors/node/runtime/guest/buffer-fs.ts (the statSync/lstatSync pair, ~line 1103) throws fsError(''ENOENT'',''stat'',path) for every path statOf cannot find, so a path whose parent is a file looks identical to one that is merely absent. Host Node answers ENOTDIR: internalModuleStat(''/app/main.js/inner'') is -20 on the host and -2 here (measured with Module._stat, both sides, two byte-identical runs). Outside the module-table shard grant (misc.ts); recorded in Readme.md under the guest surfaces that still diverge.'
status: open
re_witnessed_at: ef30294 (local main)
route_to: a lane owning packages/core/src/process/executors/node/runtime/guest/buffer-fs.ts
title: _stat reports ENOENT for a path whose parent is a file, where host answers ENOTDIR
session_id: adv6-judge-module-table-4
owner: adv6-judge-module-table-4
body: |-
  STILL OPEN, re-witnessed by adv7-fix-module-misc-12 at local main HEAD ef30294. Host node v24.15.0
  against the container, /tmp/owc-r4/mm12-fix/c-enotdir/main.js on both sides (machine while
  measuring: load 9.5-11, 71-466 MB free; cross-checked against the independent adv7 judge witness
  at /tmp/owc-r4/judge-mm12/c-enotdir, byte-identical). Not edited: the site is
  packages/core/src/process/executors/node/runtime/guest/buffer-fs.ts, outside the module-misc
  grant.

  As wide as the adversary reported: 17 of 33 probes differ. Every one of openSync, accessSync,
  writeFileSync, appendFileSync, chmodSync, utimesSync, unlinkSync, copyFileSync and renameSync
  answers ENOENT here where the host answers ENOTDIR for a path whose parent is a file
  ($CWD/plain.js/inner). realpathSync answers ENOENT and names 'realpath' where the host answers
  ENOTDIR and names 'lstat' -- the syscall name differs too. mkdirSync answers EIO with the message
  'undefined' where the host answers ENOTDIR. And the other way round, worse than a missing code:
  statSync('$CWD/plain.js/') SUCCEEDS here, so Module._stat of a file with a trailing slash is 0
  where the host throws ENOTDIR and _stat is -20.

  Site: fs.statSync and fs.lstatSync at buffer-fs.ts:1193-1202 collapse every failure of
  statOf into `throw fsError('ENOENT','stat',...)`; statOf itself (buffer-fs.ts:862) asks
  host.statJSON(canonicalOf(file)) and reads only null against an object, so no ENOTDIR can reach
  the fs layer at all, and canonicalOf (buffer-fs.ts:936) drops the trailing slash that the host
  rejects. Telling ENOTDIR from ENOENT needs the host's statJSON to answer which, or a probe of the
  parent path from inside statOf; either is a buffer-fs.ts edit. Module._stat in guest/misc.ts is
  already faithful -- it negates whatever errno statSync reports -- and is not the site.
