subject: 'Three web-stream symptoms of the `stream` surface diverge from host Node 24.15 and were re-measured in isolation at HEAD 2a4e24f, one case per process, host node v24.15.0 against a fresh container, stdout/stderr/exit compared. (1) streamIsReadable: `stream.isReadable(new ReadableStream({ start(c) { c.close() } }))` is `false` on the host and `true` in the container, because the host reads its own `Symbol(nodejs.stream.readable)` flag -- `false` for a closed readable, `true` for one still readable, `null` for a web writable (`isWritable` on a web writable is `true` on both) -- while `streamIsReadable` (packages/core/src/process/executors/node/runtime/guest/modules/stream.ts:2986) answers `true` for any web readable. (2) `stream/promises` finished() on a web stream: the container rejects `TypeError: not a function` (finishedImpl calls stream.on, which a web stream has no such method), where the host settles from the stream''s own `closed` promise -- resolved for an already-drained readable, never settled for one with a queued chunk nobody read, never settled for a writable nobody closed. Four cases: fin.webReadableClosed, fin.webReadableConsumed, fin.webWritable, pl.finishedWebStream. (3) Duplex.toWeb write-through: `Duplex.toWeb(d).writable.getWriter().write(Buffer.from(''hi''))` reaches the node PassThrough''s own `data` listeners on the host ("hi") and nothing in the container (""), because Readable.toWeb here subscribes an iterator at construction and drains the chunk before a later `data` listener is attached, while the host''s leaves the stream paused until the web side pulls; Writable.toWeb on its own and reading back through the returned readable both agree. Not engine-limited: bare QuickJS 0.32 (quickjs-emscripten 0.32.0) reports `typeof ReadableStream` and `typeof WritableStream` as `undefined`, so the whole behaviour is this container''s own JavaScript. Fix site is packages/core/src/process/executors/node/runtime/guest/modules/web-streams.ts, which exposes neither a `closed` promise nor a readable state flag -- `util.inspect` prints `state: ''closed''` but there is no such property and `Symbol(nodejs.stream.readable)` is absent -- so a faithful fix needs that file and not modules/stream.ts. Filed and not edited; recorded in Readme.md.'
