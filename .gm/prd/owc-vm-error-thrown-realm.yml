id: owc-vm-error-thrown-realm
session_id: adv5-exec-napi-vm-[object Object]
status: pending
classification: GUEST
subject: 'An error *thrown* out of a vm context is not rebuilt in the second realm, where one the context hands back is: `try { vm.runInNewContext(''throw new Error("x")'') } catch (e) { e instanceof Error }` is `true` here and `false` on host Node 24.15, while `vm.runInNewContext(''new Error("x")'') instanceof Error` is now `false` on both (measured 2026-10-23 against host Node 24.15, after the Error rehome landed in runtime/capabilities/vm.ts). The fix site is `packages/core/src/process/executors/node/runtime/guest/modules/pure-b.ts`: `runInRecord` returns through `outOfRecord`, which is what asks the host to rehome, and a throw leaves by a different path, so the rehome never runs. Routing a throw through the same rehome (catching in runInRecord, rehoming the error, rethrowing it) closes it; the capability `vm.realm` in runtime/capabilities/vm.ts already rebuilds `[object Error]` values. Split out of owc-vm-error-realm-shared, whose returned-value half is resolved.'
executor_note: 'RE-WITNESSED OPEN (adv6-exec-vm-realm) after the Map/Set/Promise rebuild landed, one container boot per probe, host node v24.15.0 against the container driven by /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core: `try { vm.runInNewContext(''throw new Error("x")'') } catch (e) { e instanceof Error }` is true here and false on the host, and a TypeError the engine raises inside a context (`runInNewContext(''null.x'')` caught outside) is `instanceof TypeError` true here and false there. Unchanged, and untouched by the vm.ts change, which only reaches what a context RETURNS. The fix site named above is confirmed and is outside this shard''s grant (packages/core/src/process/executors/node/runtime/capabilities/vm.ts and node/process.ts): runInRecord in packages/core/src/process/executors/node/runtime/guest/modules/pure-b.ts must catch what the context threw, put it through the same outOfRecord rehome its return value already goes through, and rethrow -- no host handler can do it instead, because without a `timeout` option no host call happens at all on this path and with one the thunk catches the error before the host sees it.'
owner: adv5-exec-napi-vm-[object Object]
judge_note: |
  STILL OPEN (JUDGE, shard vm-realm, session adv7b-judge-vm-realm-3, at HEAD ee97ee07a2287ef34d0548a48b70a13eccbd5bd8, differential against the same host Node v24.15.0, one container boot per case, load 10.20/16.37/19.88 with 3748 MB free). Two things in this row's territory are not engine wording and were confirmed here: a Script's filename and lineOffset are dropped, so new vm.Script('throw new Error("f")', {filename:'my.js'}).runInContext(ctx) frames as 'at <eval> (<input>:1:16)' here where the host prints 'my.js:1' then the source line, and the same for runInContext(code, ctx, {filename}), runInNewContext(code, {}, {filename}) and lineOffset:10 ('lo.js:11' on the host); every one of the six shapes prints the same two container lines, so the option is not merely misapplied but discarded, and even the no-option default differs ('evalmachine.<anonymous>:1' on the host). Bare QuickJS 0.32 can carry the name -- evalCode(code, 'my.js') puts 'my.js' in the frame -- so the plumbing is what is missing, at Script/runInContext/runInNewContext in runtime/guest/modules/pure-b.ts, which never reads the option, and at the vm.exec path in runtime/capabilities/vm.ts, whose REALM_EXEC_SRC evals the code inside a wrapper with no filename. The frame's *shape* ('at <eval> (name:line:col)' against Node's 'name:line' plus the source line) is the engine's and is recorded as such. Also confirmed and engine's own: produceCachedData/cachedDataProduced is unsupported -- typeof cachedDataProduced is 'undefined' here and 'boolean' on the host, and quickjs-emscripten 0.32 exposes no bytecode entry point on its module or its context. Named, not edited: pure-b.ts is outside this shard's grant.
