id: owc-napi-node-pty
title: 'VERIFIED at HEAD: the node-pty shim matches the real node-pty 1.1.0 add-on on 27 of 29 probe lines'
subject: 'node-pty reimplemented as a pseudo-terminal emulation over OWC child processes, since the browser has no PTY: spawn, write, resize, kill, onData and onExit. Documented limits on terminal control sequences and on job control. Oracle: node-pty on Node 24.15 for the supported subset. Depends on owc-napi-loader.'
session_id: 82e15910-75ce-4750-b785-b7acfbfe2bfb
owner: adv7-exec-napi
classification: GUEST
status: completed
resolved_at: 8f36844 (local main; packages/core/src/napi/node-pty identical on origin/main c9e85b4)
body: |-
  Reappearance, re-verified at HEAD and retired. Host node v24.15.0 with a real node-pty 1.1.0
  add-on (built from source; the shipped darwin-arm64 prebuild fails posix_spawnp on this host)
  against the container shim reached through a placeholder at build/Release/pty.node, one probe
  (/tmp/owc-r4/adv7-napi/src-pty/main.js, copied whole to cont-pty) run on both sides, twice, each
  run independent: 27 of 29 lines identical both times, host exit 0, container exit 0, both stderr
  empty. Identical lines cover: spawn, fork, open and createTerminal present; pid a number; cols 80
  and rows 24, node-pty's own defaults; write, resize, kill, onData and onExit present;
  'sh -c echo one; echo two; exit 3' delivering both lines and exit code 3; an interactive session
  taking 'echo hello-pty' one keystroke at a time and answering through onData; resize(120,40)
  observed as cols 120 rows 40; a second write received; the child's environment reaching it
  (echo $OWC_PTY_PROBE prints 1); 'exit 7' reported by onExit as exit code 7; kill() ending the
  session with exit code 0; and process reported as a string.
  The two differences are the documented limits the row records: a file that is none of sh, node or
  a .js file throws ENOENT in the container, where the host's pty starts a shell that exits 1, and
  pty.open throws ERR_PTY_UNSUPPORTED because the container has no openpty and no master or slave
  descriptor.
  No source change: the behaviour the row asks for is already in the committed tree.
  Machine state while measured: load 12.5-14.6, free pages 188564 (about 3.1 GB) at the pty arm of
  the second run; the second run reproduced the first line for line.
