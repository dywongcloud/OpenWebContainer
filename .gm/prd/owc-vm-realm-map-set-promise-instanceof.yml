title: A Map, Set or Promise from a vm context is still instanceof the constructor of the caller
subject: 'The second realm a vm value is rebuilt in covers only arrays, plain objects, Date, RegExp and (in the change now in the working tree) Error, so every other builtin crosses as the object of the guest realm it was made in and answers true to instanceof against the constructor of the caller, where host node 24.15 answers false. Measured with one value per runInNewContext call: new Map([[1,2]]) instanceof Map, new Set([1]) instanceof Set and Promise.resolve(1) instanceof Promise are all true here and all false on host node 24.15; Date, RegExp, Array and a plain object are false on both, as are an Error and an AggregateError returned from a context in the working tree now. A rejected or thrown value is owc-vm-error-realm-shared and is still live: an error thrown inside a context and caught outside is instanceof Error true here and false on the host, and a TypeError the engine raises inside a context is instanceof TypeError true here and false there. Site: rehomeInto and builtinOf in packages/core/src/process/executors/node/runtime/capabilities/vm.ts -- only the tags it rebuilds get a realm of their own, and the comment there says why a live Map is left alone (it cannot be copied without running code that could itself be interrupted), which is a real constraint for a Map the guest still holds but not for the value a context has just handed back. Not an engine limit: measured with the pinned QuickJS out of the container (/tmp/owc-r4/adv5-fix-als-3/engine2.mjs), a second context on the same runtime has intrinsics of its own -- a new Map([[1,2]]), a new Set([1]) and a Promise.resolve(1) built in it and set into the first context all answer false to instanceof against the first context''s constructor, and the two contexts'' Map are not eq -- and a realm-2 function called with realm-1 handles fills a realm-2 Map (size 1), so a Map, Set or Promise can be rebuilt rather than handed across. Re-witnessed at 1fe0710 by adv5-fix-async-als-3 (container /tmp/owc-r4/adv5-fix-als-3/out/v3.cont.raw against v3.host.out): map/set/promise true here and false on the host, thrown.instanceofError true here and false there, unchanged.'
acceptance_criteria:
- vm.runInNewContext("new Map([[1,2]])") instanceof Map, the same for Set and for Promise.resolve(1), are false here as they are on host node 24.15
- Array.isArray on an array from a context is still true and Object.prototype.toString.call still says [object Array], as on the host
witness_plan: Run /tmp/owc-r4/judge-als-3/v3/main.js under host node and in the container via /tmp/owc-r4/probe2/run-owc-repo.mts from packages/core and diff the nine instanceof lines; each type is fetched in its own runInNewContext call so the key-drop of owc-vm-realm-rebuild-drops-keys cannot mask the result.
judge_note: |
  REOPENED, not retired (JUDGE, shard vm-realm, session adv7b-judge-vm-realm-3, at HEAD ee97ee07a2287ef34d0548a48b70a13eccbd5bd8, differential against the same host Node v24.15.0, one container boot per case, load 10.20/16.37/19.88 with 3748 MB free). The instanceof half of this row holds. The promise half does not, on two measurements that are not instanceof: util.types.isPromise answers false here and true on the host for a new Promise made in a context, for Promise.resolve(1) made in a context, for the promise an async function of a context returns (both a value-returning and a void one), and for a promise an executor resolves; a host-realm promise in the same program still answers true on both. util.inspect of a promise a context made prints 'Promise {}' here where the host prints 'Promise { 1 }' for a settled one and 'Promise { <pending> }' for a pending one; the same inspect of a promise this container's own realm made prints 'Promise { <pending> }' here where the host prints 'Promise { 1 }', so the promise half of util.inspect is short of the host for every promise and not only a cross-realm one. Site named, not edited: the promise brand at packages/core/src/process/executors/node/runtime/guest/util-assert.ts, isPromise, tests 'v instanceof Promise' against the host realm, which can never see a second-realm promise -- it has to be a cross-realm check -- and that file is outside this shard's grant.
