title: A Map, Set or Promise from a vm context is still instanceof the constructor of the caller
subject: 'The second realm a vm value is rebuilt in covers only arrays, plain objects, Date, RegExp and (in the change now in the working tree) Error, so every other builtin crosses as the object of the guest realm it was made in and answers true to instanceof against the constructor of the caller, where host node 24.15 answers false. Measured with one value per runInNewContext call: new Map([[1,2]]) instanceof Map, new Set([1]) instanceof Set and Promise.resolve(1) instanceof Promise are all true here and all false on host node 24.15; Date, RegExp, Array and a plain object are false on both, as are an Error and an AggregateError returned from a context in the working tree now. A rejected or thrown value is owc-vm-error-realm-shared and is still live: an error thrown inside a context and caught outside is instanceof Error true here and false on the host, and a TypeError the engine raises inside a context is instanceof TypeError true here and false there. Site: rehomeInto and builtinOf in packages/core/src/process/executors/node/runtime/capabilities/vm.ts -- only the tags it rebuilds get a realm of their own, and the comment there says why a live Map is left alone (it cannot be copied without running code that could itself be interrupted), which is a real constraint for a Map the guest still holds but not for the value a context has just handed back.'
acceptance_criteria:
- vm.runInNewContext("new Map([[1,2]])") instanceof Map, the same for Set and for Promise.resolve(1), are false here as they are on host node 24.15
- Array.isArray on an array from a context is still true and Object.prototype.toString.call still says [object Array], as on the host
witness_plan: Run /tmp/owc-r4/judge-als-3/v3/main.js under host node and in the container via /tmp/owc-r4/probe2/run-owc-repo.mts from packages/core and diff the nine instanceof lines; each type is fetched in its own runInNewContext call so the key-drop of owc-vm-realm-rebuild-drops-keys cannot mask the result.
