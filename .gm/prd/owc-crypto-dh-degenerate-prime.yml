id: owc-crypto-dh-degenerate-prime
title: 'RESOLVED: crypto.diffieHellman now takes two KeyObjects, as Node does, and refuses a buffer'
session_id: adv5-judge-crypto-4
owner: adv5-judge-crypto-4
classification: GUEST
status: completed
subject: 'crypto.diffieHellman({prime: <empty Buffer>, privateKey, publicKey}) throws ERR_CAPABILITY "Division by zero" here where host Node 24.15 throws ERR_INVALID_ARG_VALUE "The property ''options.privateKey'' is invalid. Received <Buffer 00>": Node rejects the exponent before it reaches the arithmetic, and this runtime reaches BigInt modular exponentiation with a zero-length prime. The fix site is ''crypto.dh.compute'' in packages/core/src/process/executors/node/runtime/capabilities/crypto.ts (and primeOfBits/dhFail for the prime itself), reached from diffieHellman in packages/core/src/process/executors/node/runtime/guest/misc.ts. Witness: /tmp/owc-judge-crypto-4/proj2/main.js case X3-dh-emptyprime, host vs container at HEAD 7f6881a and again after the round-4 fixes. The headline x25519/x448 gap this row grew out of is fixed: crypto.diffieHellman({privateKey, publicKey}) with two key objects now answers 4d2d6ca3aada1bc1d7f2d6fb782cb5022812b27e10d5912c51d3d098727e967d, byte-identical to host for a fixed x25519 key.'
resolved_at: 4c63457fec2d62658bc765b0ac1a4289e8af1cd9 + the fix below (local main)
body: |-
  RESOLVED (adv5-fix-crypto-4) at local main 4c63457fec2d62658bc765b0ac1a4289e8af1cd9 + the fix below. Host node v24.15.0 against the
  container, /tmp/owc-fix-crypto-4/full/main.js on both sides: diffieHellman({ prime: <empty>,
  privateKey: <Buffer 00>, publicKey: <Buffer 00> }) throws ERR_INVALID_ARG_VALUE "The property
  'options.privateKey' is invalid. Received <Buffer 00>" on both, an empty buffer printing as
  '<Buffer >' on both, and a missing key as 'Received undefined' on both. A Buffer privateKey with
  a KeyObject publicKey names options.privateKey and a KeyObject privateKey with a Buffer publicKey
  names options.publicKey, both as on the host. The classic buffer form is gone: Node's
  diffieHellman takes KeyObjects only, a prime belongs to createDiffieHellman, and the dead
  'crypto.dh.compute' capability went with it. Two KeyObjects still agree (x25519 answers 32 bytes).
