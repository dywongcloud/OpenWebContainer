id: owc-esm-textdecoder-decode-argument
subject: 'ESM: new TextDecoder().decode() accepts anything -- decode(1), decode(''ok''), decode(true), decode([]) and decode({}) answer '''' or mojibake where host Node 24.15 throws TypeError [ERR_INVALID_ARG_TYPE]'
description: 'Measured 2026-10-23 by the judge for shard esm (session adv7-judge-esm-11), container against host Node 24.15, one container boot per case in isolation, reproduced at load 9.7 and 19.5. `new TextDecoder().decode(v)` validates nothing: decode(1) and decode(true) and decode([]) and decode({}) all answer '''', decode(''ok'') answers two replacement characters, and decode(null) throws TypeError "cannot read property ''length'' of null". Host Node 24.15 throws TypeError with code ERR_INVALID_ARG_TYPE and the message "The \"list\" argument must be an instance of SharedArrayBuffer, ArrayBuffer or ArrayBufferView." for every one of them, null included; only decode(undefined) answers '''' on both, and decode(new Uint8Array([104,105])) answers "hi" on both. It is reachable from a module the way every global is, so the ESM loader rows that mention it see it too, but it is not a loader symptom: the fix site is TextDecoderImpl.prototype.decode at packages/core/src/process/executors/node/runtime/guest/util-assert.ts:259, which is outside this shard''s grant (runtime/guest/loader.ts, runtime/resolver.ts, runtime/guest/modules/child.ts, runtime/guest/modules/stream.ts, process.ts), so it is filed and not edited.'
