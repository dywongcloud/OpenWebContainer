id: owc-guest-getter-only-assignment-message
subject: A strict-mode write to a getter-only accessor says "no setter for property" where host Node 24.15 names the property and the class
description: 'Measured 2026-10-23 (judge shard fetch-web, session adv2-judge-fetch-web-8), host Node 24.15.0 against the container, one isolated differential of 97 cases run twice in the container with byte-identical stdout and empty stderr. A write to an accessor that has a getter and no setter, inside a strict-mode body, throws TypeError with the text "no setter for property" in the container and "Cannot set property <name> of #<Class> which has only a getter" on the host: e.type="y" on an Event, m.data=1 on a MessageEvent (#<_MessageEvent>), c.code=1006 on a CloseEvent (#<_CloseEvent>), r.status=201 on a Response (#<_Response>) and q.url="http://y.test/" on a Request (#<_Request>). It is not a property of those classes: "class K { get a(){return 1} } var k=new K(); k.a=2" in a strict-mode body built inside the container reports the same two-word text where the host reports the long one, so the string is the engine and no guest-side definition of the accessor reaches it. The descriptor, the sloppy-mode no-op and Reflect.set answering false all match, which is why those attributes carry no setter at all: a setter installed only to reproduce this string is observable three times over -- the descriptor gains one the host does not have, a sloppy assignment throws where the host silently ignores it, and Reflect.set throws instead of answering false. No open row named it before this one; owc-web-event-prototype-shape carried it in its own description and is closed on its acceptance criteria with the item filed here.'
witness_plan: 'Differential of the strict-mode bodies e.type="y" on a new Event("x"), m.data=1 on a MessageEvent, c.code=1006 on a CloseEvent, r.status=201 on a Response and q.url on a Request, against host Node 24.15: the host message "Cannot set property <name> of #<Class> which has only a getter" and this engine message "no setter for property" must agree. The sloppy-mode no-op and Reflect.set answering false already agree and must stay agreeing.'
