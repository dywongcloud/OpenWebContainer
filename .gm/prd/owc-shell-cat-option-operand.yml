id: owc-shell-cat-option-operand
subject: '`cat` reads an option as the name of a file instead of numbering its standard input'
description: 'Measured 2026-10-23, differential against this machine''s /bin/sh (bash 3.2.57), live container at local HEAD 91e46e7. `exec 0<p1; cat -n` is host stdout "     1\tp\n     2\tq\n     3\tr\n" and status 0, container stdout "" stderr "ENOENT: No such file or directory, ''/app/D/-n''" and status 1 -- the container''s `cat` takes every word after the command as a path to open, so `-n` is a name it tries and fails to open, and the standard input is never read. Fix site: the `cat` builtin in packages/core/src/shell/commands/fileutils.ts.'
owner: lanmower
session_id: adv3-judge-shell-fd-3
witness_plan: Run `printf 'p\nq\nr\n' > p1; exec 0<p1; cat -n` on both sides; stdout must hold the numbered lines and the status 0.
status: pending
