id: owc-esm-namespace-mutation-error-text
subject: 'ESM: writing to or deleting from a namespace throws QuickJS''s message, so ns.default = 1 gives "TypeError: ''default'' is read-only" where host Node 24.15 gives "TypeError: Cannot assign to read only property ''default'' of object ''[object Module]''"'
description: >-
  Measured 2026-10-22 (judge lane, differential container vs host Node 24.15). Three error texts
  come from QuickJS rather than from Node because the namespace is the engine's own module namespace
  object: assignment -> "'default' is read-only" (host "Cannot assign to read only property 'default'
  of object '[object Module]'"), delete -> "could not delete property" (host "Cannot delete property
  'default' of [object Module]"), and String(ns) -> "toPrimitive" (host "Cannot convert object to
  primitive value"). Same for a CJS namespace as for an ESM one. The row's own keys --
  ns[Symbol.toStringTag] === 'Module', Object.prototype.toString.call(ns) === '[object Module]' and
  the '[Module: null prototype]' prefix util.inspect writes -- now all match. Fix: give the namespace
  a set/deleteProperty/Symbol.toPrimitive that throws Node's text.
owner: lanmower
session_id: adv-judge-fetch-url-esm-4
witness_plan: >-
  Differential ns.default = 1, delete ns.default and String(ns) for a CJS and an ESM namespace, host
  Node 24.15 vs container; every message must match.
status: pending
