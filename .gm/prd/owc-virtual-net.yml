witness_2026_10_24_adv12_judge: |-
  JUDGE FOR SHARD NET (session adv12-judge-net-1) at HEAD e022edd plus this pass's net.ts change,
  differential against host node v24.15.0, one process per side, container driven by
  /tmp/owc-r4/probe2/run-owc-repo.mts out of packages/core, stdout, stderr and exit captured
  separately, every probe run twice on each side, load 4.7-10.9. Six probes written for this pass,
  none copied from the executor: /tmp/owc-r4/adv12-judge-net-1/{j1-sa-opts,j2-sa-parse,
  j3-sa-familycase,j4-bl-json,j5-shape,j6-autofam,j7-udp6zone}, plus j11-conn for the
  connection-counting scene the adversary added. The adversary's own r-sa and r-bl were re-run as a
  regression check afterwards.

  Every disputed case was re-run IN ISOLATION and every one DIVERGED on the pre-fix tree: j1 5
  lines, j2 13, j3 2, j4 7, j5 8, j6 4, j7 4. Twenty-three of those twenty-five lines are now FIXED
  and j1, j2, j3, j5 and j6 come back 0 lines different from host on both container runs. Changed,
  all in packages/core/src/process/executors/node/runtime/guest/modules/net.ts: `new
  net.SocketAddress(null | 1 | 'x' | [])` is ERR_INVALID_ARG_TYPE 'The "options" argument must be of
  type object' (Node defaults the option to an empty object and then validateObject's it, so
  undefined still builds the default address and an array is refused); `SocketAddress.parse` of a
  non-string is ERR_INVALID_ARG_TYPE 'The "input" argument must be of type string'; parse now reads
  its input the way host Node 24.15 does -- as the host and port of URLParse('http://' + input) --
  so it carries the port (':1' -> 1, ':1024' -> 1024, ':65535' -> 65535) and answers 0 only for the
  one port that scheme elides (':80', and ':0' which is 0 anyway), takes '01.2.3.4:80' for 1.2.3.4
  and '010.1.1.1' for 8.1.1.1 (a URL host part with a leading zero is octal), parses '1.2.3.4:', and
  refuses both a bracketed literal carrying a zone ('[fe80::1%lo0]:80') and an unbracketed IPv6
  literal ('::1'), which a URL's host may not be; the default address is chosen from the family as
  it was given, before its case is folded, so 'iPv4' and 'IPV4' with no address named are
  ERR_INVALID_ADDRESS 'Invalid socket address'; a BigInt argument renders 'type bigint (24n)'; the
  state is held in non-enumerable own fields, so an instance enumerates nothing (Object.keys is [])
  as a host's does, and the constructor takes no named parameter so net.SocketAddress.length is 0;
  net.BlockList carries toJSON() (the rules array, newest first) and fromJSON(data) (a JSON string
  or array of strings in the text `rules` writes them in, 'Address: IPv4 1.2.3.4', refused 'The
  "data" argument must be of type string or string[]' otherwise); and net.setDefaultAutoSelectFamily
  and its getter keep what a caller set (false reads back false, a non-boolean is ERR_INVALID_ARG_TYPE
  'The "value" argument must be of type boolean'), as the attempt-timeout pair does. A udp6 socket
  now binds a scoped literal: bind(21025, '::1%lo0') binds ::1, address() reports ::1 with no zone on
  it, and a datagram sent to '::1%lo0' arrives at it -- a zone names which interface a link-local
  address means, not which host it is, and dgram is BF['dgram'] inside net.ts, inside this shard's
  grant.

  REGRESSION: the adversary's own r-sa (85 lines) is now 0 lines different from host, where it was
  17, and r-bl (67) is 1, where it was 8.

  TWO lines are not fixable and stay recorded. j4's and r-bl's one remaining line is the engine's:
  calling a static that does not exist -- net.BlockList.fromJSON(...) -- is 'net.BlockList.fromJSON
  is not a function' on V8 and 'not a function' on QuickJS, and net.BlockList() with no 'new' is
  'Class constructor BlockList cannot be invoked without new' against 'class constructors must be
  invoked with new'. j7's one remaining line is the host's own ephemeral source port (56694 against
  this side's 49152).

  The connection-counting scene the adversary added is CONFIRMED in isolation and ends STALE, not
  fixed (j11-conn, both reruns identical on each side): server.close() issued while four connects are
  in flight has host Node 24.15 refuse all four with ECONNREFUSED, where here all four clients emit
  'connect'; the server emits 0 'connection' on both sides. It is not the count and not a missing
  feature: this side's connect reaches the hub in the turn it was made, because netResolve answers an
  IP literal synchronously, so the four dials land before the close that follows them, where a host's
  libuv defers a connect to a later poll and the close wins. Making it match means deferring every
  connect a macrotask, a scheduling change across the whole surface that the Readme records as
  matching host line for line (connect ordering, bytesWritten, the end-of-connection ordering), so it
  is the same one-scheduling-model difference the row already carries rather than one small change.
  One concrete line for it, and one for the whole value-type surface, added to Readme.md under
  Virtual net. npx tsc --noEmit clean in packages/core; pnpm build succeeds.
