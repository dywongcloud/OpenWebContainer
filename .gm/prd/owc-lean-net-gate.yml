subject: 'REFUTED: the lean-net-negative symptom is real -- G_NET -> NODELETE is refused gate_denied / lean-net-negative while the shared tree is net-positive -- but it blocks nothing. lean-net-negative sits on 1 of 376 edges; G_NET has an ungated second exit (G_NET -> DIFFBUDGET, backreference, label "the artifact grew") and NODELETE an ungated second entrance (GUARDANDGO -> NODELETE), so 145 of 146 states are gate-free reachable from G_NET and NODELETE is one of them. A live transition {"to":"DIFFBUDGET"} at ts 1792722881260 took that exit with no waiver, no vendored graph and no override after the walk had sat at G_NET for ~8.8 days. No user decision is owed. The supporting arithmetic is refuted too: whole tree vs HEAD measures 170 files +2414/-601, not 14 files +606/-89 (14 is the git_status count, and git_status reports excluded: [".gm"]), and .gm alone measures 101 files +1167/-421, not +120/-6; the residual is 69 files +1247/-180, net +1067, still positive, so "untracking .gm/** does not flip the predicate" survives while the numbers behind it do not.'
